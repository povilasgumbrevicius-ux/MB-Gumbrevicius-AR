<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KONTAKTAI | MB GUMBREVIČIUS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;600&family=Montserrat:wght@100;200;300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #c8a96e;
            --bg: #080808;
            --text: #e8e2d8;
            --text-dim: rgba(232, 226, 216, 0.5);
            --ease-luxury: cubic-bezier(0.19, 1, 0.22, 1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            cursor: none;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── CURSOR ── */
        .cursor { position: fixed; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: transform 0.1s ease; }
        .cursor-ring { position: fixed; width: 36px; height: 36px; border: 1px solid rgba(200, 169, 110, 0.4); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); transition: all 0.45s var(--ease-luxury); }

        /* ── HEADER ── */
        header { padding: 32px 56px; display: flex; justify-content: space-between; align-items: center; }
        .back-link { display: flex; align-items: center; text-decoration: none; color: var(--text); gap: 20px; }
        .logo-wow { height: 52px; width: auto; transition: transform 0.6s var(--ease-luxury); }
        .company-name { font-family: 'Montserrat'; font-size: 0.7rem; letter-spacing: 8px; text-transform: uppercase; color: var(--text-dim); }

        /* ── FORM SECTION ── */
        .contact-wrap {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 100px 56px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            letter-spacing: 15px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-align: center;
        }

        .sub-title {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.4rem;
            color: var(--text-dim);
            margin-bottom: 80px;
            text-align: center;
        }

        form { width: 100%; display: grid; gap: 40px; }

        .field { position: relative; }

        label {
            font-family: 'Cinzel';
            font-size: 0.65rem;
            letter-spacing: 4px;
            color: var(--accent);
            text-transform: uppercase;
            display: block;
            margin-bottom: 12px;
        }

        input, textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 15px 0;
            color: #fff;
            font-family: 'Montserrat';
            font-weight: 300;
            font-size: 1.1rem;
            transition: border-color 0.5s var(--ease-luxury);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            justify-self: center;
            margin-top: 60px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 22px 60px;
            font-family: 'Cinzel';
            font-size: 0.8rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            transition: all 0.5s var(--ease-luxury);
            cursor: none;
        }

        button:hover {
            background: var(--accent);
            color: #000;
        }

        footer { padding: 60px 56px; text-align: center; font-size: 0.7rem; color: var(--text-dim); letter-spacing: 4px; text-transform: uppercase; }

        @media (max-width: 768px) {
            header { padding: 24px; }
            .company-name { display: none; }
            .contact-wrap { padding: 60px 24px; }
        }
    </style>
</head>
<body>

    <div class="cursor" id="cursor"></div>
    <div class="cursor-ring" id="cursor-ring"></div>

    <header>
        <a href="interiors.html" class="back-link">
            <img src="portfolio/logo/Logo_white_SVG.svg" class="logo-wow" alt="Logo">
            <div class="company-name">Grįžti į galeriją</div>
        </a>
    </header>

    <main class="contact-wrap">
        <h1>Pradėkime</h1>
        <p class="sub-title">Aptarkime jūsų viziją.</p>

        <form action="https://formsubmit.co/povilas@gumbrevicius.lt" method="POST">
            <input type="hidden" name="_subject" value="Nauja projekto užklausa!">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <div class="field">
                <label>Vardas / Įmonė</label>
                <input type="text" name="name" required placeholder="Kas kreipiasi?">
            </div>

            <div class="field">
                <label>El. paštas</label>
                <input type="email" name="email" required placeholder="Kur atsiųsti atsakymą?">
            </div>

            <div class="field">
                <label>Žinutė</label>
                <textarea name="message" rows="4" required placeholder="Trumpai apie jūsų projektą..."></textarea>
            </div>

            <button type="submit">Siųsti užklausą</button>
        </form>
    </main>

    <footer>
        MB GUMBREVIČIUS © 2026 | Purvina tiesa
    </footer>

    <script>
        const cursor = document.getElementById('cursor');
        const cursorRing = document.getElementById('cursor-ring');
        let mx = -100, my = -100, rx = -100, ry = -100;
        document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

        function animateCursor() {
            cursor.style.left = mx + 'px';
            cursor.style.top = my + 'px';
            rx += (mx - rx) * 0.12;
            ry += (my - ry) * 0.12;
            cursorRing.style.left = rx + 'px';
            cursorRing.style.top = ry + 'px';
            requestAnimationFrame(animateCursor);
        }
        animateCursor();
    </script>
</body>
</html>
