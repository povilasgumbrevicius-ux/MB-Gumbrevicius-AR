<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERJERO VIZUALIZACIJOS | MB GUMBREVIČIUS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,200;0,300;1,200;1,300;1,400&family=Montserrat:wght@100;200;300;400&display=swap" rel="stylesheet">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F0VPWTKVR3"></script>
    <script>
        window.dataLayer=window.dataLayer||[];
        function gtag(){dataLayer.push(arguments);}
        gtag('js',new Date());
        gtag('config','G-F0VPWTKVR3');
    </script>

    <style>
        :root{
            --accent:#c8a96e;
            --bg:#080808;
            --text:#e8e2d8;
            --text-dim:rgba(232,226,216,.55);
            --ease:cubic-bezier(.19,1,.22,1);
            --pad:clamp(24px,4vw,80px);
        }

        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

        html{background:var(--bg);scroll-behavior:smooth;}
        body{
            min-height:100vh;
            background:var(--bg);
            color:var(--text);
            font-family:'Montserrat',sans-serif;
            font-weight:300;
            -webkit-font-smoothing:antialiased;
        }

        header{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            z-index:100;
            padding:clamp(16px,2.5vw,32px) var(--pad);
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:linear-gradient(to bottom,rgba(8,8,8,.97) 0%,rgba(8,8,8,.72) 58%,rgba(8,8,8,0) 100%);
        }

        .header-left{
            display:flex;
            align-items:center;
            gap:clamp(12px,1.5vw,20px);
            color:var(--text);
            text-decoration:none;
        }

        .logo-wow{
            height:clamp(34px,3.5vw,48px);
            width:auto;
            transition:transform .6s var(--ease);
        }

        .header-left:hover .logo-wow{transform:scale(1.05);}

        .company-name{
            font-size:clamp(.75rem,1vw,.95rem);
            letter-spacing:3px;
            font-weight:300;
        }

        .header-nav{
            display:flex;
            align-items:center;
            gap:clamp(16px,2.2vw,32px);
        }

        .nav-link{
            font-family:'Cinzel',serif;
            font-size:clamp(.52rem,.7vw,.65rem);
            letter-spacing:3px;
            color:var(--text-dim);
            text-decoration:none;
            text-transform:uppercase;
            transition:color .3s ease;
        }

        .nav-link:hover{color:var(--accent);}

        main{
            width:min(1760px,100%);
            margin:0 auto;
            padding:clamp(130px,13vw,190px) var(--pad) clamp(70px,8vw,120px);
        }

        .portfolio-grid{
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:clamp(18px,2.3vw,42px);
        }

        .project-card{
            position:relative;
            display:block;
            min-height:clamp(420px,42vw,760px);
            overflow:hidden;
            background:#111;
            cursor:pointer;
            border:0;
            width:100%;
            color:inherit;
            text-align:left;
            font:inherit;
        }

        .project-card img{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
            transition:transform 1.1s var(--ease),filter .8s ease;
        }

        .project-card::after{
            content:"";
            position:absolute;
            inset:0;
            background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.08) 44%,rgba(0,0,0,0) 70%);
            pointer-events:none;
        }

        .project-card:hover img{transform:scale(1.025);}

        .project-meta{
            position:absolute;
            z-index:2;
            left:clamp(22px,3vw,48px);
            right:clamp(22px,3vw,48px);
            bottom:clamp(22px,3vw,42px);
        }

        .project-number{
            display:block;
            margin-bottom:10px;
            font-family:'Cinzel',serif;
            font-size:.58rem;
            letter-spacing:4px;
            color:var(--accent);
            text-transform:uppercase;
        }

        .project-title{
            font-family:'Cormorant Garamond',serif;
            font-weight:300;
            font-size:clamp(2rem,3.2vw,4.1rem);
            line-height:.95;
        }

        /* Fullscreen project viewer */
        .viewer{
            position:fixed;
            inset:0;
            z-index:1000;
            display:none;
            background:#050505;
            overflow-y:auto;
            overscroll-behavior:contain;
        }

        .viewer.open{display:block;}

        .viewer-close{
            position:fixed;
            top:clamp(18px,2.4vw,32px);
            right:clamp(18px,2.8vw,42px);
            z-index:1010;
            width:48px;
            height:48px;
            border:0;
            background:rgba(0,0,0,.45);
            color:#fff;
            font-family:'Montserrat',sans-serif;
            font-size:2rem;
            font-weight:200;
            line-height:1;
            cursor:pointer;
            opacity:.72;
            transition:opacity .25s ease,background .25s ease;
        }

        .viewer-close:hover{opacity:1;background:rgba(0,0,0,.75);}

        .viewer-inner{
            width:min(1500px,100%);
            margin:0 auto;
            padding:clamp(85px,8vw,120px) var(--pad) clamp(60px,8vw,110px);
        }

        .viewer-head{
            max-width:900px;
            margin:0 0 clamp(35px,5vw,70px);
        }

        .viewer-title{
            font-family:'Cormorant Garamond',serif;
            font-weight:300;
            font-size:clamp(2.7rem,5vw,6rem);
            line-height:.95;
            margin-bottom:18px;
        }

        .viewer-credit{
            font-size:clamp(.68rem,.9vw,.8rem);
            line-height:1.7;
            letter-spacing:1.2px;
            color:var(--text-dim);
        }

        .viewer-gallery{
            display:grid;
            grid-template-columns:1fr;
            gap:clamp(16px,2vw,30px);
        }

        .viewer-gallery img{
            width:100%;
            height:auto;
            display:block;
            background:#111;
        }

        body.viewer-open{overflow:hidden;}

        @media(max-width:900px){
            .portfolio-grid{grid-template-columns:1fr;}
            .project-card{min-height:68vh;}
        }

        @media(max-width:680px){
            .company-name{display:none;}
            .header-nav{gap:14px;}
            .nav-link{letter-spacing:2px;}
            main{padding-top:105px;}
            .project-card{min-height:62vh;}
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html" class="header-left" aria-label="Grįžti į pagrindinį puslapį">
            <img src="portfolio/logo/Logo_white_SVG.svg" class="logo-wow" alt="MB Gumbrevičius">
            <div class="company-name">MB Gumbrevičius</div>
        </a>

        <nav class="header-nav">
            <a href="apiemane.html" class="nav-link">Apie mane</a>
        </nav>
    </header>

    <main>
        <section class="portfolio-grid" aria-label="Interjero vizualizacijų projektai">
            <button class="project-card" type="button" onclick="openProject('project-1')" aria-label="Atidaryti pirmą projektą">
                <img src="portfolio/interior/1/2.webp" alt="Interjero vizualizacijos projektas">
                <div class="project-meta">
                    <span class="project-number">Projektas 01</span>
                </div>
            </button>
        </section>
    </main>

    <section class="viewer" id="project-1" aria-hidden="true">
        <button class="viewer-close" type="button" onclick="closeProject()" aria-label="Uždaryti">×</button>

        <div class="viewer-inner">
            <div class="viewer-gallery">
                <img src="portfolio/interior/1/1.webp" alt="Interjero vizualizacija 1" loading="lazy">
                <img src="portfolio/interior/1/2.webp" alt="Interjero vizualizacija 2" loading="lazy">
                <img src="portfolio/interior/1/3.webp" alt="Interjero vizualizacija 3" loading="lazy">
                <img src="portfolio/interior/1/4.webp" alt="Interjero vizualizacija 4" loading="lazy">
                <img src="portfolio/interior/1/5.webp" alt="Interjero vizualizacija 5" loading="lazy">
                <img src="portfolio/interior/1/6.webp" alt="Interjero vizualizacija 6" loading="lazy">
                <img src="portfolio/interior/1/7.webp" alt="Interjero vizualizacija 7" loading="lazy">
                <img src="portfolio/interior/1/8.webp" alt="Interjero vizualizacija 8" loading="lazy">
                <img src="portfolio/interior/1/9.webp" alt="Interjero vizualizacija 9" loading="lazy">
            </div>
        </div>
    </section>

    <script>
        function openProject(id){
            const viewer=document.getElementById(id);
            if(!viewer)return;
            viewer.classList.add('open');
            viewer.setAttribute('aria-hidden','false');
            viewer.scrollTop=0;
            document.body.classList.add('viewer-open');
        }

        function closeProject(){
            document.querySelectorAll('.viewer.open').forEach(viewer=>{
                viewer.classList.remove('open');
                viewer.setAttribute('aria-hidden','true');
            });
            document.body.classList.remove('viewer-open');
        }

        document.addEventListener('keydown',e=>{
            if(e.key==='Escape')closeProject();
        });
    </script>
</body>
</html>
