<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR Peržiūra - Sūrainis (Naujas Šriftas & AR Fix)</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        /* Bendrai body ir model-viewer Z-INDEX ir font nustatymai */
        body { 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            position: relative; 
            font-family: Arial, sans-serif; /* Pagrindinis šriftas */
        }
        model-viewer { 
            width: 100%; 
            height: 100%; 
            z-index: 10; /* Z-index model-viewer ir AR mygtukui */
            position: relative; 
        }
        
        /* Hotspotų stiliai - Z-INDEX NUSTATYMAS */
        .StaticHotspot {
            position: absolute; 
            z-index: 50; /* Hotspotai virš model-viewer */
            border-radius: 50%;
            width: 35px; height: 35px;
            border: 2px solid #FFFFFF;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
            transition: transform 0.1s ease;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: bold; color: white;
            line-height: 1; 
        }
        
        /* 3. Iššokančio langelio (Tooltip) stilius: ŠRIFTO PAKEITIMAS */
        .StaticHotspot .tooltip {
            visibility: hidden;
            background-color: #000000;
            color: #fff;
            text-align: left;
            border-radius: 4px;
            padding: 8px 12px;
            position: absolute;
            z-index: 60; /* Tooltipai virš Hotspotų */
            
            width: max-content;
            max-width: 350px; 
            
            /* ŠRIFTO PAKEITIMAS Į VERDANA */
            font-family: Verdana, Geneva, sans-serif; 
            font-size: 0.95em; 
            line-height: 1.4;
            
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
            pointer-events: none;
        }
        
        /* ... kiti stiliai (pozicijos, hover, sąrašai) lieka nepakeisti ... */

        .Alergenai { background: #FF4444; top: 20px; right: 20px; }
        .Sudetis { background: #2AA1FF; top: 80px; right: 20px; }
        .InstrukcijosBtn { background: #6c757d; top: 20px; left: 20px; } 
        
        .Alergenai .tooltip, .Sudetis .tooltip { right: 120%; top: 50%; transform: translateY(-50%); }
        .InstrukcijosBtn .tooltip { left: 120%; top: 50%; transform: translateY(-50%); }
        .StaticHotspot:hover .tooltip { visibility: visible; opacity: 1; }
        .StaticHotspot .tooltip ul, .StaticHotspot .tooltip ol { font-size: 1em; padding-left: 20px; margin: 5px 0 0 0; }
        /* 0. Tėvinis konteineris */
        .container { position: relative; width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            // **ABSOLIUTUS URL**
            src="https://ar.gumbrevicius.lt/modeliai/maistas/cheeseburger.glb" 
            alt="Sūrainis" 
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            ios-src="https://ar.gumbrevicius.lt/modeliai/maistas/cheeseburger.glb"
            crossorigin 
            camera-controls 
            shadow-intensity="1" 
            exposure="1.0" 
            auto-rotate>
        </model-viewer>
        
        </div>
</body>
</html>
