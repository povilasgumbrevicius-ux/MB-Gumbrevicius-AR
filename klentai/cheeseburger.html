<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR Peržiūra - Sūrainis (Custom AR Mygtukas)</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        /* 0. Tėvinis konteineris */
        .container { position: relative; width: 100%; height: 100vh; }

        /* Pagrindinis stilius */
        body { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; }
        model-viewer { 
            width: 100%; height: 100%; 
            z-index: 10; /* Mažiausias Z-index */
            position: relative; 
        }
        
        /* 1. CUSTOM AR MYGTUKO STILIAI (VISADA MATOMAS) */
        #ar-button {
            position: absolute;
            bottom: 30px; 
            right: 30px;
            z-index: 200; /* AR Mygtukas: 200 */
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s;
        }

        /* 2. HOTSPOT'Ų STILIAI */
        .StaticHotspot {
            position: absolute; 
            z-index: 300; /* HOTSPOTAI: 300 (Virš AR mygtuko) */
            border-radius: 50%; width: 35px; height: 35px; border: 2px solid #FFFFFF; cursor: pointer; box-shadow: 0 0 8px rgba(0, 0, 0, 0.6); transition: transform 0.1s ease; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: white; line-height: 1; 
        }
        .StaticHotspot:hover { transform: scale(1.2); }
        .Alergenai { background: #FF4444; top: 20px; right: 20px; }
        .Sudetis { background: #2AA1FF; top: 80px; right: 20px; }
        .InstrukcijosBtn { background: #6c757d; top: 20px; left: 20px; }

        /* 3. TOOLTIP'Ų STILIAI (NAUJAS Z-INDEX ir ŠRIFTAS) */
        .StaticHotspot .tooltip {
            visibility: hidden; background-color: #000000; color: #fff; text-align: left; border-radius: 4px; padding: 8px 12px; position: absolute;
            z-index: 400; /* TOOLTIPAI: 400 (Virš Hotspot'ų) */
            
            font-family: Verdana, Geneva, sans-serif; /* ŠRIFTO PATAISA */
            
            width: max-content; max-width: 350px; opacity: 0; transition: opacity 0.3s, visibility 0.3s; pointer-events: none; line-height: 1.4; font-size: 0.95em; 
        }
        
        /* 3a. Tooltip'o pozicija DEŠINĖS PUSĖS mygtukams */
        .Alergenai .tooltip, .Sudetis .tooltip { right: 120%; top: 50%; transform: translateY(-50%); }

        /* 3b. Tooltip'o pozicija KAIRĖS PUSĖS mygtukui */
        .InstrukcijosBtn .tooltip { left: 120%; top: 50%; transform: translateY(-50%); }

        /* Rodo Tooltip'ą, kai pelė užvedama */
        .StaticHotspot:hover .tooltip { visibility: visible; opacity: 1; }
        .StaticHotspot .tooltip ul, .StaticHotspot .tooltip ol { font-size: 1em; padding-left: 20px; margin: 5px 0 0 0; }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer
            id="modelViewer" /* ID pridedamas JS valdymui */
            // ABSOLIUTUS URL PAKEITIMAS
            src="https://ar.gumbrevicius.lt/modeliai/maistas/cheeseburger.glb" 
            alt="Sūrainis" 
            // PAŠALINTAS 'ar' atributas
            // PAŠALINTAS 'ar-modes' atributas (jie mums nebereikalingi)
            crossorigin 
            camera-controls 
            shadow-intensity="1" 
            exposure="1.0" 
            auto-rotate>
        </model-viewer>
        
        <button id="ar-button">Peržiūrėti AR</button>
        
        <div class="StaticHotspot Alergenai">...</div>
        <div class="StaticHotspot Sudetis">...</div>
        <div class="StaticHotspot InstrukcijosBtn">...</div>

    </div>

    <script>
        const arButton = document.getElementById('ar-button');
        const modelViewer = document.getElementById('modelViewer');
        
        if (arButton && modelViewer) {
            arButton.addEventListener('click', () => {
                // Priverstinis AR paleidimas per GLB failą
                modelViewer.activateAR();
            });
        }
    </script>
</body>
</html>
