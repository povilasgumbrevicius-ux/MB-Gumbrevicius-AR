<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR Peržiūra - Šokoladinis tortas (Galutinė Versija)</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        /* Baziniai stiliai */
        .container { position: relative; width: 100%; height: 100vh; }
        body { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100%; z-index: 10; position: relative; }
        
        /* 1. CUSTOM AR MYGTUKO STILIAI (VISADA MATOMAS) */
        #ar-button {
            position: absolute;
            bottom: 30px; 
            right: 30px;
            z-index: 200; /* AR Mygtukas: 200 */
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s;
        }

        /* 2. HOTSPOT'Ų STILIAI (Z-INDEX 300) */
        .StaticHotspot { 
            position: absolute; 
            z-index: 300; /* HOTSPOTAI: 300 (Virš AR mygtuko) */
            border-radius: 50%; width: 35px; height: 35px; border: 2px solid #FFFFFF; cursor: pointer; box-shadow: 0 0 8px rgba(0, 0, 0, 0.6); transition: transform 0.1s ease; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: white; line-height: 1; 
        }
        .StaticHotspot:hover { transform: scale(1.2); }
        .Alergenai { background: #FF4444; top: 20px; right: 20px; }
        .Sudetis { background: #2AA1FF; top: 80px; right: 20px; }
        
        /* 3. TOOLTIP'Ų STILIAI (Z-INDEX 400 ir ŠRIFTO PATAISA) */
        .StaticHotspot .tooltip {
            visibility: hidden; background-color: #000000; color: #fff; text-align: left; border-radius: 4px; padding: 8px 12px; position: absolute; 
            z-index: 400; /* TOOLTIPAI: 400 (Virš Hotspot'ų) */
            right: 120%; top: 50%; transform: translateY(-50%); width: max-content; max-width: 200px; 
            
            font-family: Verdana, Geneva, sans-serif; /* ŠRIFTO PAKEITIMAS */
            
            opacity: 0; transition: opacity 0.3s, visibility 0.3s; pointer-events: none; line-height: 1.4;
        }
        .StaticHotspot:hover .tooltip { visibility: visible; opacity: 1; }
        .StaticHotspot .tooltip ul { font-size: 1em; padding-left: 20px; margin: 5px 0 0 0; }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            id="modelViewer" 
            src="https://ar.gumbrevicius.lt/modeliai/maistas/sokoladinis_tortas.glb" 
            alt="Šokoladinis tortas" 
            camera-controls 
            shadow-intensity="1" 
            exposure="1.0" 
            auto-rotate>
        </model-viewer>
        
        <button id="ar-button">Peržiūrėti AR</button>
        
        <div class="StaticHotspot Alergenai">!
            <div class="tooltip">
                <p style="margin:0; font-weight: bold;">⚠️ Svarbūs Alergenai:</p>
                <ul style="list-style: disc; padding-left: 20px; margin: 5px 0 0 0;">
                    <li>Pienas</li><li>Kviečiai (Glutenas)</li><li>Kiaušiniai</li>
                </ul>
            </div>
        </div>
        <div class="StaticHotspot Sudetis">i
            <div class="tooltip">
                <p style="margin:0; font-weight: bold;">Papildoma Informacija:</p>
                <p style="margin: 5px 0 0 0;">Naudotas 70% kakavos šokoladas.</p>
                <p style="margin: 0;">Tinka vegetarams.</p>
            </div>
        </div>
    </div>

    <script>
        const arButton = document.getElementById('ar-button');
        const modelViewer = document.getElementById('modelViewer');
        
        if (arButton && modelViewer) {
            arButton.addEventListener('click', () => {
                // Priverstinis AR paleidimas per GLB failą
                modelViewer.activateAR();
            });
        }
    </script>
</body>
</html>
