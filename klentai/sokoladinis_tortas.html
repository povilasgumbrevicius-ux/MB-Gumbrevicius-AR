<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR Peržiūra - Šokoladinis tortas (Statiniai Hotspotai)</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        /* 0. Tėvinis konteineris: būtinas statiniams elementams pozicionuoti */
        .container {
            position: relative; /* Nustato pozicijos atskaitos tašką */
            width: 100%; 
            height: 100vh; /* Užima visą lango aukštį */
        }

        /* Pagrindinis stilius */
        body { margin: 0; padding: 0; height: 100vh; }
        model-viewer { 
            width: 100%; 
            height: 100%; 
        }
        
        /* 1. Bendras STATINIO Hotspot'o stilius */
        .StaticHotspot {
            position: absolute; /* Pririšimas prie .container kraštų */
            z-index: 100; /* Užtikrina, kad matytųsi virš model-viewer */
            
            /* Vizualinis stilius */
            border-radius: 50%;
            width: 35px; /* Šiek tiek didesni */
            height: 35px;
            border: 2px solid #FFFFFF;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
            transition: transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            line-height: 1; 
        }
        .StaticHotspot:hover {
            transform: scale(1.2); /* Vizualinė reakcija */
        }
        
        /* 2. Konkretus Hotspotų Pozicionavimas (Dešinėje pusėje) */
        .Alergenai {
            background: #FF4444; /* Raudonas (Alergenai) */
            top: 20px;       /* 20px nuo viršaus */
            right: 20px;     /* 20px nuo dešinio krašto */
        }
        
        .Sudetis {
            background: #2AA1FF; /* Mėlynas (Sudėtis/Info) */
            top: 80px;      /* 80px nuo viršaus (žemiau alergenų) */
            right: 20px;     /* 20px nuo dešinio krašto */
        }

        /* 3. Iššokančio langelio (Tooltip) stilius */
        .StaticHotspot .tooltip {
            visibility: hidden;
            background-color: #000000;
            color: #fff;
            text-align: left;
            border-radius: 4px;
            padding: 8px 12px;
            position: absolute;
            z-index: 10;
            right: 120%; /* Svarbu: Rodo kairėje nuo mygtuko */
            top: 50%;
            transform: translateY(-50%); /* Centruoja vertikaliai */
            width: max-content;
            max-width: 200px;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
            pointer-events: none;
            line-height: 1.4;
        }
        
        /* Rodo Tooltip'ą, kai pelė užvedama */
        .StaticHotspot:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            src="../modeliai/maistas/sokoladinis_tortas.glb" 
            alt="Šokoladinis tortas" 
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            shadow-intensity="1" 
            exposure="1.0" 
            auto-rotate>
        </model-viewer>
        
        <div class="StaticHotspot Alergenai">
            !
            <div class="tooltip">
                <p style="margin:0; font-weight: bold;">⚠️ Svarbūs Alergenai:</p>
                <ul style="list-style: disc; padding-left: 20px; margin: 5px 0 0 0;">
                    <li>Pienas</li>
                    <li>Kviečiai (Glutenas)</li>
                    <li>Kiaušiniai</li>
                </ul>
            </div>
        </div>
        
        <div class="StaticHotspot Sudetis">
            i
            <div class="tooltip">
                <p style="margin:0; font-weight: bold;">Papildoma Informacija:</p>
                <p style="margin: 5px 0 0 0;">Naudotas 70% kakavos šokoladas.</p>
                <p style="margin: 0;">Tinka vegetarams.</p>
            </div>
        </div>
        
    </div>
</body>
</html>
