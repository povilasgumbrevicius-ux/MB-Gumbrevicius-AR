<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Gumbrevičius MB</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --wow-blue: #00d2ff;
            --candle-warm: rgba(255, 120, 30, 0.4);
            --silver-dust: rgba(200, 200, 200, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            background-color: #000;
            color: #fff;
            font-family: 'Cinzel', serif;
            width: 100vw;
            min-height: 100vh;
            overflow-x: hidden; 
            overflow-y: auto;
        }

        /* --- ŽVAKĖ (Desktop) --- */
        #candlelight {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle 35px at var(--x, 50%) var(--y, 50%), 
                        var(--candle-warm) 0%, 
                        rgba(0, 0, 0, 1) 100%);
            z-index: 10;
            pointer-events: none;
        }

        header {
            position: absolute;
            top: 50px;
            left: 50px;
            z-index: 30;
            display: flex;
            flex-direction: row; 
            align-items: center;
        }

        .back-link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-wow {
            height: 80px; 
            width: auto;
            filter: drop-shadow(0 0 10px var(--wow-blue));
            opacity: 0.9;
            margin-right: 25px; 
            transition: all 0.6s ease;
        }

        .company-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            font-size: 1.4rem; 
            letter-spacing: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        .back-link:hover .logo-wow {
            filter: drop-shadow(0 0 25px var(--wow-blue));
            transform: scale(1.05);
        }

        /* --- MASONRY GRID --- */
        .portfolio-container {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
            padding: 180px 50px 100px 50px;
            column-count: 3;
            column-gap: 30px;
        }

        .portfolio-item {
            position: relative;
            width: 100%;
            margin-bottom: 30px;
            break-inside: avoid;
            background-color: #050505;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            opacity: 1; 
            filter: none;
            transition: all 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            cursor: pointer;
        }

        .portfolio-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.8s ease;
        }

        .portfolio-item:hover {
            border-color: var(--wow-blue);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
            transform: scale(1.02);
            z-index: 25;
        }

        /* --- MOBILI ADAPTACIJA (FIXES) --- */
        @media (max-width: 1200px) {
            .portfolio-container { column-count: 2; }
        }

        @media (max-width: 768px) {
            #candlelight { display: none; }

            header {
                top: 20px;
                left: 20px;
            }
            .logo-wow {
                height: 50px;
                margin-right: 15px;
            }
            .company-name {
                font-size: 0.8rem;
                letter-spacing: 4px;
            }
            .portfolio-container { 
                column-count: 1; 
                padding: 100px 20px 50px 20px;
            }
            
            .portfolio-item {
                margin-bottom: 25px;
                border-color: rgba(0, 210, 255, 0.3);
                animation: item-pulse 3s infinite alternate ease-in-out;
            }

            .portfolio-item:hover {
                transform: none;
            }
        }

        /* --- ANIMACIJOS --- */
        @keyframes item-pulse {
            from { 
                box-shadow: 0 0 5px rgba(0, 210, 255, 0.1);
                border-color: rgba(0, 210, 255, 0.1);
            }
            to { 
                box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
                border-color: rgba(0, 210, 255, 0.6);
            }
        }

        @keyframes pulse-glow {
            from { opacity: 0.4; }
            to { opacity: 1; text-shadow: 0 0 20px var(--wow-blue); }
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 50px 0;
            z-index: 30;
            position: relative;
        }

        .rekvizitai {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: var(--wow-blue);
            animation: pulse-glow 3s infinite alternate;
        }

        .dust {
            position: absolute;
            width: 2px; height: 2px;
            background: var(--silver-dust);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="candlelight"></div>

    <header>
        <a href="index.html" class="back-link">
            <img src="portfolio/logo/Logo_white_SVG.svg" class="logo-wow" alt="Logo">
            <div class="company-name">MB Gumbrevičius</div>
        </a>
    </header>

    <div class="portfolio-container">
        <div class="portfolio-item"><img src="portfolio/AR4-Gumbrevicius.webp" alt="AR 4"></div>
        <div class="portfolio-item"><img src="portfolio/AR5-Gumbrevicius.webp" alt="AR 5"></div>
        <div class="portfolio-item"><img src="portfolio/Box-5-Gumbrevicius.webp" alt="Box Simulation"></div>
        <div class="portfolio-item"><img src="portfolio/Can5-Gumbrevicius.webp" alt="Can Design"></div>
        <div class="portfolio-item"><img src="portfolio/Dark-side1-Gumbrevicius.webp" alt="Dark Side 1"></div>
        <div class="portfolio-item"><img src="portfolio/Dark-side2-Gumbrevicius.webp" alt="Dark Side 2"></div>
        <div class="portfolio-item"><img src="portfolio/Dezute3-Gumbrevicius.webp" alt="Package Design"></div>
        <div class="portfolio-item"><img src="portfolio/Gumbrevicius-k1.webp" alt="Engine Core"></div>
        <div class="portfolio-item"><img src="portfolio/Improvizacija7-Gumbrevicius.webp" alt="Improvisation"></div>
        <div class="portfolio-item"><img src="portfolio/Micelinis-vanduo4-Gumbrevicius.webp" alt="Product 4"></div>
        <div class="portfolio-item"><img src="portfolio/Micelinis-vanduo8-Gumbrevicius.webp" alt="Product 8"></div>
        <div class="portfolio-item"><img src="portfolio/Micelinis-vanduo9-Gumbrevicius.webp" alt="Product 9"></div>
    </div>

    <footer>
        <div class="rekvizitai">
            Povilas Gumbrevičius | info@gumbrevicius.lt
        </div>
    </footer>

    <script>
        const candle = document.getElementById('candlelight');

        const moveHandler = (e) => {
            let x, y;
            if (e.type.includes('touch')) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            candle.style.setProperty('--x', x + 'px');
            candle.style.setProperty('--y', y + 'px');
        };

        document.addEventListener('mousemove', moveHandler);
        document.addEventListener('touchstart', moveHandler, { passive: false });
        document.addEventListener('touchmove', moveHandler, { passive: false });

        setInterval(() => {
            const dust = document.createElement('div');
            dust.className = 'dust';
            dust.style.left = Math.random() * 100 + 'vw';
            dust.style.top = (Math.random() * document.documentElement.scrollHeight) + 'px';
            document.body.appendChild(dust);
            setTimeout(() => dust.remove(), 10000);
        }, 500);
    </script>
</body>
</html>
