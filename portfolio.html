<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Gumbrevičius MB</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
   <style>
        :root {
            --wow-blue: #00d2ff;
            --candle-warm: rgba(255, 120, 30, 0.4);
            --silver-dust: rgba(200, 200, 200, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            background-color: #000;
            color: #fff;
            font-family: 'Cinzel', serif;
            width: 100vw;
            min-height: 100vh;
            overflow-x: hidden; 
            overflow-y: auto;
        }

        #candlelight {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle 35px at var(--x, 50%) var(--y, 50%), 
                        var(--candle-warm) 0%, 
                        rgba(0, 0, 0, 1) 100%);
            z-index: 10;
            pointer-events: none;
        }

        header {
            position: absolute;
            top: 50px;
            left: 50px;
            z-index: 30;
            display: flex;
            flex-direction: row; 
            align-items: center;
        }

        .back-link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-wow {
            height: 80px; 
            width: auto;
            filter: drop-shadow(0 0 10px var(--wow-blue));
            opacity: 0.9;
            margin-right: 25px; 
            transition: all 0.6s ease;
        }

        .company-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            font-size: 1.4rem; 
            letter-spacing: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        .back-link:hover .logo-wow {
            filter: drop-shadow(0 0 25px var(--wow-blue));
            transform: scale(1.05);
        }

        /* --- ČIA PRASIDEDA MASONRY GRID (Mūro siena) --- */
        .portfolio-container {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 1800px; /* Pritaikyta tavo rezoliucijai */
            margin: 0 auto;
            padding: 180px 50px 100px 50px;
            column-count: 3; /* Padalinta į 3 stulpelius */
            column-gap: 30px;
        }

        @media (max-width: 1200px) {
            .portfolio-container { column-count: 2; }
        }
        @media (max-width: 768px) {
            .portfolio-container { column-count: 1; }
        }

        .portfolio-item {
            position: relative;
            width: 100%;
            margin-bottom: 30px; /* Tarpas po nuotrauka */
            break-inside: avoid; /* Neleidžia nuotraukai lūžti į kitą stulpelį */
            background-color: #050505;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            opacity: 0.3; 
            filter: blur(4px);
            transition: all 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            cursor: pointer;
        }

        .portfolio-item img {
            width: 100%;
            height: auto; /* Leidžia nuotraukai būti savo natūralaus aukščio */
            display: block;
            transition: transform 0.8s ease;
        }

        .portfolio-item:hover {
            opacity: 1;
            filter: blur(0px);
            border-color: var(--wow-blue);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
            transform: scale(1.02); /* Švelnus padidėjimas */
            z-index: 25;
        }

        .portfolio-item:hover img {
            transform: none; /* Sustabdomas vidinis didėjimas, nes didėja visas blokas */
        }
        /* --- ČIA BAIGIASI MASONRY GRID --- */

        footer {
            width: 100%;
            text-align: center;
            padding: 50px 0;
            z-index: 30;
            position: relative;
        }

        .rekvizitai {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: var(--wow-blue);
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            from { opacity: 0.4; }
            to { opacity: 1; text-shadow: 0 0 20px var(--wow-blue); }
        }

        .dust {
            position: absolute;
            width: 2px; height: 2px;
            background: var(--silver-dust);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
