<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>1001 Legends Galerija</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; background: #fff; overflow: hidden; }
        .container { position: relative; width: 100%; height: 100vh; }
        model-viewer { width: 100%; height: 100%; background-color: #f7f7f7; }
        
        /* Navigacija apačioje */
        .controls {
            position: fixed; 
            bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); 
            left: 50%; 
            transform: translateX(-50%);
            display: flex; 
            align-items: center; 
            gap: 20px; 
            z-index: 9999; 
            background: rgba(255, 255, 255, 0.9); 
            padding: 10px 25px; 
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            pointer-events: auto; 
        }

        .nav-btn {
            background: #222; color: white; border: none; padding: 10px 18px;
            border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 18px;
        }

        #model-label { font-size: 15px; font-weight: bold; min-width: 80px; text-align: center; color: #333; }

        /* AR Mygtukas */
        #ar-custom-button {
            background-color: #4CAF50; color: white; padding: 14px 24px;
            border-radius: 8px; border: none; cursor: pointer; font-weight: bold;
            font-size: 16px; position: absolute; 
            top: calc(env(safe-area-inset-top, 0px) + 20px); 
            right: 20px;
            z-index: 9999; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        #ar-error-message { 
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%); 
            background: #ffc107; color: #333; padding: 10px 20px; border-radius: 5px; 
            z-index: 10000; font-weight: bold; display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <model-viewer 
            id="ar-model"
            src="" 
            ar 
            ar-modes="scene-viewer quick-look webxr" 
            ar-placement="wall"
            camera-controls 
            shadow-intensity="2" 
            exposure="1.2"
            disable-tap
        >
            <button slot="ar-button" id="ar-custom-button">🖼️ Pasimatuok</button>
        </model-viewer>

        <div class="controls">
            <button class="nav-btn" onclick="changeModel(-1)">❮</button>
            <span id="model-label">Kraunama...</span>
            <button class="nav-btn" onclick="changeModel(1)">❯</button>
        </div>
    </div>

    <div id="ar-error-message"></div>

    <script>
        const models = [
            "barboros_smekla.glb", "basiliskas.glb", "gelezinis_vilkas.glb",
