<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diaro </title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f0f0; overflow: hidden; }
        .container { position: relative; width: 100%; height: 100vh; }
        model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
        
        /* AR Mygtukas viršuje */
        #ar-button {
            background-color: #4CAF50;
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Navigacijos juosta apačioje */
        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 999;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 30px;
            border-radius: 100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            backdrop-filter: blur(5px);
        }

        .nav-btn {
            background: #222;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s ease;
        }

        .nav-btn:active { transform: scale(0.9); }
        .nav-btn:hover { background: #000; }

        #model-label {
            font-size: 16px;
            font-weight: 700;
            min-width: 90px;
            text-align: center;
            color: #333;
        }

        /* Klaidos pranešimas */
        #error-msg {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
            z-index: 10000;
        }
    </style>
</head>
<body>

    <div id="error-msg">⚠️ Nepavyko užkrauti modelių sąrašo.</div>

    <div class="container">
        <model-viewer 
            id="main-viewer"
            src="" 
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            shadow-intensity="1.5" 
            exposure="1"
            environment-image="neutral"
            auto-rotate
        >
            <button slot="ar-button" id="ar-button">
                🔳 MATUOTI APLINKOJE
            </button>
        </model-viewer>
    </div>

    <div class="controls" id="nav-ui" style="display: none;">
        <button class="nav-btn" onclick="changeModel(-1)">❮</button>
        <span id="model-label">1 / 1</span>
        <button class="nav-btn" onclick="changeModel(1)">❯</button>
    </div>

    <script>
        const folder = "../Diaro/";
        // Pridedame laiko žymą, kad naršyklė visada imtų šviežią CSV failą iš GitHub
        const csvPath = folder + "models.csv?v=" + new Date().getTime(); 
        
        let models = [];
        let currentIndex = 0;

        const viewer = document.querySelector('#main-viewer');
        const label = document.getElementById('model-label');
        const navUI = document.getElementById('nav-ui');
        const errorUI = document.getElementById('error-msg');

        // 1. Nuskaitome CSV
        async function init() {
            try {
                const response = await fetch(csvPath);
                if (!response.ok) throw new Error();
                const text = await response.text();
                
                // Paverčiame tekstą į sąrašą
                models = text.split('\n')
                             .map(line => line.trim())
                             .filter(line => line.length > 0 && line.includes('.glb'));

                if (models.length > 0) {
                    if (models.length > 1) navUI.style.display = 'flex';
                    updateModel();
                } else {
                    console.error("CSV failas tuščias arba nėra .glb failų");
                }
            } catch (e) {
                errorUI.style.display = 'block';
                console.error("Klaida nuskaitant CSV:", e);
            }
        }

        // 2. Atnaujiname modelį ekrane
        function updateModel() {
            viewer.src = folder + models[currentIndex];
            label.innerText = (currentIndex + 1) + " / " + models.length;
        }

        // 3. Navigacija
        window.changeModel = (step) => {
            currentIndex = (currentIndex + step + models.length) % models.length;
            updateModel();
        };

        // Paleidžiame sistemą
        init();
    </script>
</body>
</html>
