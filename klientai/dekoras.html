<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dekoro AR Peržiūra</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        /* Minimalūs CSS stiliai, kad modelis užimtų visą ekraną */
        .container { position: relative; width: 100%; height: 100vh; }
        body { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; }
        
        model-viewer { 
            width: 100%; 
            height: 100%; 
            z-index: 100; 
            transform: translateZ(0); 
        }
        
        /* Stilius Pasirinktiniam AR Mygtukui (Viršuje Dešinėje) */
        #ar-custom-button {
            background-color: #007bff; /* Mėlyna spalva */
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
            position: absolute; 
            top: 10px; 
            right: 10px; 
            z-index: 2500;
        }
        #ar-custom-button:hover {
            background-color: #0056b3;
        }
        
        /* Stilius klaidos pranešimui, jei AR neveikia */
        #ar-error-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            background: #ffc107; color: #333; padding: 10px 20px; border-radius: 5px; 
            z-index: 9999; font-weight: bold; display: none; text-align: center; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            /* 💥 ĮKeltas JŪSŲ modelio ADRESAS 💥 */
            src="https://ar.gumbrevicius.lt/modeliai/dekoras/dekoras.glb" 
            alt="Dekoro Modelis" 
            
            ios-src="https://ar.gumbrevicius.lt/modeliai/dekoras/dekoras.glb"
            ar 
            ar-modes="scene-viewer quick-look" 
            
            camera-controls 
            shadow-intensity="1" 
            exposure="1.0" 
            auto-rotate>

            <button slot="ar-button" id="ar-custom-button">
                ▶️ Patvirtinti AR
            </button>
            
        </model-viewer>
        
    </div>

    <div id="ar-error-message"></div>

    <script>
        const modelViewer = document.querySelector('model-viewer');
        const errorMessage = document.getElementById('ar-error-message');
        const arCustomButton = document.getElementById('ar-custom-button');

        // Būsena patvirtinimas
        modelViewer.addEventListener('ar-status', (event) => {
            const status = event.detail.status;
            
            if (status === 'failed' || status === 'not-present' || status === 'unsupported') {
                // Jei AR neveikia, paslepiame mygtuką ir rodome klaidos pranešimą
                arCustomButton.style.display = 'none';
                errorMessage.innerHTML = '⚠️ Šis įrenginys nepalaiko Papildytosios Realybės (AR) funkcijos. Pabandykite su naujesniu telefonu ar planšete.';
                errorMessage.style.display = 'block';
                
            } else if (status === 'success') {
                // Jei AR palaikoma, užtikriname, kad mygtukas būtų rodomas
                arCustomButton.style.display = 'block';
                errorMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
