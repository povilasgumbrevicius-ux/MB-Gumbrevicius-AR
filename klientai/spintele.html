<!DOCTYPE html>
<html>
<head>
    <title>3D Spintelė - Visi 6 Stalčiai (GALUTINĖ VERSIJA su UI Debug'u)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        
        body { margin: 0; padding: 0; height: 100vh; background-color: #f4f4f4; }
        .container { position: relative; width: 100%; height: 100vh; }
        model-viewer { 
            width: 100%; height: 100%; background-color: #ffffff;
            --camera-controls-touch-radius: 10px; --camera-controls-move-speed: 2;
        }
        
        /* Hotspot stilius */
        .hotspot-button {
            display: block;
            width: 30px; 
            height: 30px; 
            border: 4px solid white;
            border-radius: 50%; 
            background-color: rgba(0, 123, 255, 0.8); 
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, background-color 0.2s;
        }
        .hotspot-button:hover {
            transform: scale(1.2);
            background-color: rgba(40, 167, 69, 0.9); 
        }

        /* Statuso pranešimo stilius */
        #status-message { 
            position: fixed; 
            bottom: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: #ffc107; 
            color: #333; 
            padding: 10px 20px; 
            border-radius: 5px; 
            z-index: 9999; 
            font-weight: bold; 
            display: none; 
            text-align: center; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
            max-width: 80%; /* Kad neužimtų viso ekrano */
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            id="spintele-model" 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelės modelis" 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1.0"
            exposure="1.0"
        >
            <button class="hotspot-button" 
                    slot="hotspot-stalcius-1" 
                    data-position="-0.2 0.7 0.5" 
                    data-normal="0 0 1" 
                    data-animation-name="stalcius1Action" 
                    data-is-open="false">
            </button>

            <button class="hotspot-button" 
                    slot="hotspot-stalcius-2" 
                    data-position="0.2 0.7 0.5" 
                    data-normal="0 0 1" 
                    data-animation-name="stalcius2Action" 
                    data-is-open="false">
            </button>

            <button class="hotspot-button" 
                    slot="hotspot-stalcius-3" 
                    data-position="-0.2 0.5 0.5" 
                    data-normal="0 0 1" 
                    data-animation-name="stalcius3Action" 
                    data-is-open="false">
            </button>

            <button class="hotspot-button" 
                    slot="hotspot-stalcius-4" 
                    data-position="0.2 0.5 0.5" 
                    data-normal="0 0 1" 
                    data-animation-name="stalcius4Action" 
                    data-is-open="false">
            </button>
            
            <button class="hotspot-button" 
                    slot="hotspot-stalcius-5" 
                    data-position="-0.2 0.3 0.5" 
                    data-normal="0 0 1" 
                    data-animation-name="stalcius5Action" 
                    data-is-open="false">
            </button>
            
            <button class="hotspot-button" 
                    slot="hotspot-stalcius-6" 
                    data-position="0.2 0.3 0.5" 
                    data-normal="0 0 1" 
                    data-animation-name="stalcius6Action" 
                    data-is-open="false">
            </button>
        </model-viewer>
        
        <div id="status-message"></div>
    </div>

    <script>
        const modelViewer = document.getElementById('spintele-model');
        const hotspotButtons = document.querySelectorAll('.hotspot-button'); 
        const statusMessage = document.getElementById('status-message');
        
        // Animacijos nustatymai (bendri visoms 100 kadrų animacijoms):
        const FPS = 24.0; 
        const OPEN_FRAMES = 50.0; 
        const CLOSE_FRAMES = 50.0; 
        
        const OPEN_DURATION = OPEN_FRAMES / FPS; 
        const TOTAL_DURATION = (OPEN_FRAMES + CLOSE_FRAMES) / FPS; 
        
        const TARGET_DURATION = 0.5; 
        const TIME_EPSILON = 0.01; 
        
        let isAnimating = false;
        let animationMonitorId = null;
        let activeControlButton = null; 
        
        const REQUIRED_ANIMATIONS = [
            "stalcius1Action", "stalcius2Action", "stalcius3Action", 
            "stalcius4Action", "stalcius5Action", "stalcius6Action"
        ];

        // Funkcija: Stebi animacijos eigą (liko nepakeista)
        function checkAnimation() {
            if (!isAnimating || !activeControlButton) {
                cancelAnimationFrame(animationMonitorId);
                return;
            }

            const currentTime = modelViewer.currentTime; 
            const isOpening = activeControlButton.isOpening;
            const targetTime = activeControlButton.targetTime;
            const animationName = activeControlButton.getAttribute('data-animation-name');
            
            if (isOpening) {
                if (currentTime >= targetTime - TIME_EPSILON) {
                    modelViewer.pause();
                    modelViewer.currentTime = targetTime; 
                    isAnimating = false; 
                    cancelAnimationFrame(animationMonitorId);
                    
                    hotspotButtons.forEach(btn => {
                        if (btn.getAttribute('data-animation-name') === animationName) {
                            btn.setAttribute('data-is-open', 'true');
                        }
                    });
                    activeControlButton = null;
                    return;
                }
            } else {
                if (currentTime >= targetTime - TIME_EPSILON) {
                    modelViewer.pause();
                    modelViewer.currentTime = 0; 
                    isAnimating = false; 
                    cancelAnimationFrame(animationMonitorId);
                    
                    hotspotButtons.forEach(btn => {
                        if (btn.getAttribute('data-animation-name') === animationName) {
                            btn.setAttribute('data-is-open', 'false');
                        }
                    });
                    activeControlButton = null;
                    return;
                }
            }
            animationMonitorId = requestAnimationFrame(checkAnimation);
        }


        function toggleAnimation(event) {
            if (isAnimating) return; 
            
            const button = event.currentTarget; 
            const animationName = button.getAttribute('data-animation-name');
            let isOpen = button.getAttribute('data-is-open') === 'true';

            if (!animationName) return;
            
            let timeRange;
            let targetTime;
            let isOpening;

            if (!isOpen) {
                timeRange = [0, OPEN_DURATION]; 
                modelViewer.currentTime = 0; 
                targetTime = OPEN_DURATION; 
                isOpening = true;
                
            } else {
                timeRange = [OPEN_DURATION, TOTAL_DURATION]; 
                modelViewer.currentTime = OPEN_DURATION; 
                targetTime = TOTAL_DURATION; 
                isOpening = false;
            }
            
            try {
                isAnimating = true; 
                activeControlButton = button; 
                activeControlButton.isOpening = isOpening; 
                activeControlButton.targetTime = targetTime;

                modelViewer.animationName = animationName;

                modelViewer.play({ 
                    timeRange: timeRange,
                    duration: TARGET_DURATION, 
                    repetitions: 1,
                    direction: 'forwards' 
                });
                
                animationMonitorId = requestAnimationFrame(checkAnimation);
                
            } catch (e) {
                isAnimating = false; 
                activeControlButton = null;
            }
        }
        
        hotspotButtons.forEach(button => {
            if(button) button.addEventListener('click', toggleAnimation);
        });

        // PRADINĖ PATIKRA (Dabar per UI)
        modelViewer.addEventListener('model-visibility', () => {
             const availableAnimations = modelViewer.availableAnimations || [];
             let missingAnimations = [];
             
             REQUIRED_ANIMATIONS.forEach(animationName => {
                 if (!availableAnimations.includes(animationName)) {
                     missingAnimations.push(animationName);
                 }
             });

             if (missingAnimations.length > 0) {
                 // Klaida
                 statusMessage.innerHTML = `❌ RASTA TIK ${availableAnimations.length} ANIMACIJŲ. <br> Trūksta: ${missingAnimations.join(', ')}. <br> Rastos: ${availableAnimations.join(', ')}`;
                 statusMessage.style.backgroundColor = '#f44336'; // Raudona
                 statusMessage.style.color = 'white';
             } else {
                 // Sėkmė
                 statusMessage.innerHTML = `✅ Visi 6 stalčiai paruošti! (${availableAnimations.length} animacijos rastos).`;
                 statusMessage.style.backgroundColor = '#4CAF50'; // Žalia
                 statusMessage.style.color = 'white';
             }

             statusMessage.style.display = 'block';

             // Nustatome visas rastas animacijas į 0 poziciją
             availableAnimations.forEach(animationName => {
                 modelViewer.animationName = animationName;
                 modelViewer.currentTime = 0; 
                 modelViewer.pause();
             });
        });
        
    </script>
</body>
