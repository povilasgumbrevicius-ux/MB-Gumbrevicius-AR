<!DOCTYPE html>
<html>
<head>
    <title>3D Spintelė - Stalčius 1 Valdymas Mygtuku (Segmentų Logika)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        
        body { margin: 0; padding: 0; height: 100vh; background-color: #f4f4f4; }
        .container { position: relative; width: 100%; height: 100vh; }
        model-viewer { 
            width: 100%; 
            height: 100%; 
            background-color: #ffffff;
            --camera-controls-touch-radius: 10px; 
            --camera-controls-move-speed: 2;
        }

        /* Valdymo mygtuko konteineris */
        #controls-overlay {
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 2500;
        }

        /* Stalčiaus mygtukų stiliai */
        .drawer-button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .drawer-button.open {
            background-color: #28a745; /* Žalia, kai atidarytas */
        }
        .drawer-button:hover {
            background-color: #0056b3;
        }
        
        /* AR Mygtuko ir Statuso stiliai lieka tie patys */
        #ar-custom-button {
            z-index: 3000; position: absolute; top: 20px; right: 20px; background-color: #4CAF50; color: white; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; transition: background-color 0.3s;
        }
        #status-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); background: #ffc107; color: #333; padding: 10px 20px; border-radius: 5px; z-index: 9999; font-weight: bold; display: none; text-align: center; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div id="controls-overlay">
            <button id="toggle-stalcius-1" class="drawer-button" data-animation-name="stalcius1Action" data-is-open="false">
                Atidaryti Stalčių 1
            </button>
        </div>

        <model-viewer 
            id="spintele-model" 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelės modelis" 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1.0"
            exposure="1.0"
            ar ar-modes="webxr scene-viewer quick-look"
        >
            <button slot="ar-button" id="ar-custom-button">
                 ▶️ Rodyti AR
            </button>
        </model-viewer>
        
        <div id="status-message"></div>
    </div>

    <script>
        const modelViewer = document.getElementById('spintele-model');
        const statusMessage = document.getElementById('status-message');
        const toggleButton = document.getElementById('toggle-stalcius-1');
        
        // Animacijos nustatymai, pagrįsti Jūsų Blenderio darbų:
        const FPS = 24.0; 
        const OPEN_FRAMES = 50.0; // 0-50 kadrai
        const CLOSE_FRAMES = 50.0; // 51-100 kadrai
        
        const OPEN_DURATION = OPEN_FRAMES / FPS; 
        const CLOSE_DURATION = CLOSE_FRAMES / FPS; 
        
        const TARGET_DURATION = 0.5; // Tikslinis laikas, per kurį turi įvykti segmentas (0.5s)
        let animationDurationTotal = 0; // Bus nustatyta įkrovus modelį

        function toggleAnimation(event) {
            const button = event.currentTarget; 
            const animationName = button.getAttribute('data-animation-name');
            let isOpen = button.getAttribute('data-is-open') === 'true';

            if (!animationName) return;
            
            let timeRange;
            let startDuration; // Animacijos pradžios momentas

            if (!isOpen) {
                // ATIDARYMAS (Naudojame Segmentą 0-50 kadrų, kuris trunka OPEN_DURATION sekundžių)
                timeRange = [0, OPEN_DURATION]; 
                startDuration = 0; 
                
            } else {
                // UŽDARYMAS (Naudojame Segmentą 51-100 kadrų)
                // Šis segmentas prasideda ties OPEN_DURATION sekundės žyma ir trunka CLOSE_DURATION sekundžių
                timeRange = [OPEN_DURATION, OPEN_DURATION + CLOSE_DURATION]; 
                startDuration = OPEN_DURATION;
            }
            
            try {
                // Nustatome pradinę poziciją, kad būtų užtikrintas sklandus startas
                modelViewer.currentTime = startDuration; 

                modelViewer.play({ 
                    animationName: animationName, 
                    timeRange: timeRange,
                    duration: TARGET_DURATION, // Visada paleidžiame per 0.5s
                    repetitions: 1,
                    direction: 'forwards' // Visi segmentai vykdomi tik pirmyn
                });
                
                // Atnaujiname mygtuko būseną ir tekstą
                button.setAttribute('data-is-open', (!isOpen).toString());
                button.textContent = isOpen ? `Atidaryti Stalčių 1` : `Uždaryti Stalčių 1`;
                button.classList.toggle('open', !isOpen);

            } catch (e) {
                 statusMessage.innerHTML = `❌ KLAIDA: Nepavyko paleisti animacijos.`;
                 statusMessage.style.backgroundColor = '#f44336';
                 statusMessage.style.display = 'block';
            }
        }
        
        if (toggleButton) {
            toggleButton.addEventListener('click', toggleAnimation);
        }

        modelViewer.addEventListener('model-visibility', () => {
             const availableAnimations = modelViewer.availableAnimations || [];
             const animationName = toggleButton.getAttribute('data-animation-name');

             if (availableAnimations.includes(animationName)) {
                 
                 // Šis tikrinimas dabar yra tik informacinis, nes mes nustatome laikus per konstantas (FPS, FRAMES)
                 const animation = modelViewer.model.animations.find(a => a.name === animationName);
                 if (animation) {
                      animationDurationTotal = animation.duration;
                 }
                 
                 // Nustatome į 0 poziciją (uždaryta)
                 modelViewer.animationName = animationName;
                 modelViewer.currentTime = 0; 
                 modelViewer.pause();
                 
                 statusMessage.innerHTML = `✅ Modelis paruoštas! Animacija '${animationName}' rasta. Atidarymo segmentas: ${OPEN_DURATION.toFixed(2)}s. Uždarymo segmentas: ${(CLOSE_DURATION / TARGET_DURATION).toFixed(2)}x greičiu.`;
                 statusMessage.style.backgroundColor = '#4CAF50';
                 statusMessage.style.display = 'block';
             } else {
                 statusMessage.innerHTML = `❌ Animacija '${animationName}' nerasta. Rastos: ${availableAnimations.join(', ')}`;
                 statusMessage.style.backgroundColor = '#f44336';
                 statusMessage.style.display = 'block';
             }
        });
        
    </script>
</body>
</html>
