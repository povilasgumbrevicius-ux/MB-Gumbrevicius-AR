<!DOCTYPE html>
<html>
<head>
    <title>3D Spintelė - SPRENDIMAS PER SHAPE KEYS</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; height: 100vh; background-color: #f4f4f4; }
        .container { position: relative; width: 100%; height: 100vh; }
        
        model-viewer { 
            width: 100%; height: 100%; 
            background-color: #ffffff;
        }
        
        /* Hotspot stilius */
        .hotspot-button {
            display: block; width: 30px; height: 30px; border: 4px solid white;
            border-radius: 50%; background-color: rgba(0, 123, 255, 0.8); 
            cursor: pointer; box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, background-color 0.2s;
        }
        .hotspot-button[data-is-open="true"] {
             background-color: rgba(40, 167, 69, 0.9); /* Žalia, kai atidaryta */
        }
        .hotspot-button:hover {
            transform: scale(1.2);
        }

        /* Statuso pranešimas (DEBUG) */
        #status-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            background: #333; color: white; padding: 10px 20px; border-radius: 5px; 
            z-index: 9999; font-weight: bold; text-align: center; display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            id="spintele-model" 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelės modelis" 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1.0"
            exposure="1.0"
        >
            <button class="hotspot-button" slot="hotspot-stalcius-1" data-position="-0.2 0.7 0.5" data-drawer-index="1" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-2" data-position="0.2 0.7 0.5" data-drawer-index="2" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-3" data-position="-0.2 0.5 0.5" data-drawer-index="3" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-4" data-position="0.2 0.5 0.5" data-drawer-index="4" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-5" data-position="-0.2 0.3 0.5" data-drawer-index="5" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-6" data-position="0.2 0.3 0.5" data-drawer-index="6" data-is-open="false"></button>
        </model-viewer>
        
        <div id="status-message"></div>
    </div>

    <script>
        const modelViewer = document.getElementById('spintele-model');
        const hotspotButtons = document.querySelectorAll('.hotspot-button'); 
        const statusMessage = document.getElementById('status-message');
        
        // KRITINĖ KONSTANTA: Jūsų Shape Key pavadinimo formatas (stalcius1, stalcius2...)
        const SHAPE_KEY_PREFIX = "stalcius"; 
        const SHAPE_KEY_SUFFIX = ""; // Paliekame tuščią, nes pavadinimas yra tiesiog "stalcius1"

        // PAGRINDINĖ FUNKCIJA: Valdymas per Shape Keys
        function toggleShapeKey(event) {
            const button = event.currentTarget; 
            const drawerIndex = button.getAttribute('data-drawer-index');
            let isOpen = button.getAttribute('data-is-open') === 'true';

            // Sukuriamas tikslus Shape Key pavadinimas (pvz., "stalcius" + 3 = "stalcius3")
            const targetShapeKey = SHAPE_KEY_PREFIX + drawerIndex + SHAPE_KEY_SUFFIX;
            
            let targetValue;
            let targetState;

            if (!isOpen) {
                // ATIDARYMAS: Nustatome Shape Key Value į 1.0 (pilnai atidaryta)
                targetValue = 1.0;
                targetState = 'true';
            } else {
                // UŽDARYMAS: Nustatome Shape Key Value į 0.0 (uždaryta)
                targetValue = 0.0; 
                targetState = 'false';
            }
            
            // Nustatome Shape Key svorį (valdome istiesti geometrija)
            // model-viewer automatiškai animuos perėjimą tarp 0.0 ir 1.0
            modelViewer.setMeshUniform(targetShapeKey, targetValue);
            
            // Atnaujiname Hotspot'o būseną
            button.setAttribute('data-is-open', targetState);
        }
        
        hotspotButtons.forEach(button => {
            if(button) button.addEventListener('click', toggleShapeKey);
        });

        // PRADINĖ BŪSENA: Nustatome modelį į Uždarytą pozą (visi Shape Keys = 0.0)
        modelViewer.addEventListener('model-visibility', () => {
             // Vizualinis patvirtinimas
             statusMessage.innerHTML = `✅ Modelis paruoštas. Naudojamas Shape Key valdymas.`;
             statusMessage.style.backgroundColor = '#4CAF50'; 
             statusMessage.style.display = 'block';
             
             // Užtikriname, kad pradinė būsena būtų UŽDARYTA (visi raktų svoriai = 0.0)
             for (let i = 1; i <= 6; i++) {
                 const initialKey = SHAPE_KEY_PREFIX + i + SHAPE_KEY_SUFFIX;
                 modelViewer.setMeshUniform(initialKey, 0.0);
             }
        });
        
    </script>
</body>
</html>
