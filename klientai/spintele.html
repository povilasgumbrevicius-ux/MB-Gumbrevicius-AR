<!DOCTYPE html>
<html>
<head>
    <title>3D Spintelė - Stalčius 1 Patikrintas Sustabdymas (RAF)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        /* ... (Stiliai lieka tie patys) ... */
        body { margin: 0; padding: 0; height: 100vh; background-color: #f4f4f4; }
        .container { position: relative; width: 100%; height: 100vh; }
        model-viewer { 
            width: 100%; height: 100%; background-color: #ffffff; --camera-controls-touch-radius: 10px; --camera-controls-move-speed: 2;
        }

        #controls-overlay {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 2500;
        }
        .drawer-button {
            padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background-color 0.2s;
        }
        .drawer-button.open { background-color: #28a745; }
        .drawer-button:hover { background-color: #0056b3; }
        
        #ar-custom-button {
            z-index: 3000; position: absolute; top: 20px; right: 20px; background-color: #4CAF50; color: white; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; transition: background-color 0.3s;
        }
        #status-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); background: #ffc107; color: #333; padding: 10px 20px; border-radius: 5px; z-index: 9999; font-weight: bold; display: none; text-align: center; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div id="controls-overlay">
            <button id="toggle-stalcius-1" class="drawer-button" data-animation-name="stalcius1Action" data-is-open="false">
                Atidaryti Stalčių 1
            </button>
        </div>

        <model-viewer 
            id="spintele-model" 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelės modelis" 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1.0"
            exposure="1.0"
            ar ar-modes="webxr scene-viewer quick-look"
        >
            <button slot="ar-button" id="ar-custom-button">
                 ▶️ Rodyti AR
            </button>
        </model-viewer>
        
        <div id="status-message"></div>
    </div>

    <script>
        const modelViewer = document.getElementById('spintele-model');
        const statusMessage = document.getElementById('status-message');
        const toggleButton = document.getElementById('toggle-stalcius-1');
        
        // Animacijos nustatymai:
        const FPS = 24.0; 
        const OPEN_FRAMES = 50.0; 
        const CLOSE_FRAMES = 50.0; 
        
        const OPEN_DURATION = OPEN_FRAMES / FPS; // 0.0s iki 2.0833s
        const TOTAL_DURATION = (OPEN_FRAMES + CLOSE_FRAMES) / FPS; // 0.0s iki 4.1666s
        
        const TARGET_DURATION = 0.5; // Tikslinis greitis (0.5s)
        
        let isAnimating = false;
        let animationMonitorId = null;
        let targetTime = 0; 
        let isOpening = false; // Stebime, ar vyksta atidarymas, ar uždarymas

        // Svarbiausia funkcija: Stebi animacijos eigą ir sustabdo ją tiksliai
        function checkAnimation() {
            if (!isAnimating) {
                cancelAnimationFrame(animationMonitorId);
                return;
            }

            // Dabartinis laikas
            const currentTime = modelViewer.currentTime; 
            
            // Atidarymo atveju tikriname, ar pasiekėme atidarymo pabaigos tašką (OPEN_DURATION)
            if (isOpening && currentTime >= targetTime) {
                modelViewer.pause();
                isAnimating = false;
                modelViewer.currentTime = targetTime; // Užtikriname, kad sustotų tiksliai 50 kadre
                cancelAnimationFrame(animationMonitorId);
                console.log('Sustabdyta ties atidarymo pabaiga (50 kadras).');
                return;
            } 
            
            // Uždarymo atveju tikriname, ar pasiekėme uždarymo pabaigos tašką (0.0s)
            // PASTABA: Jei naudojamas Uždarymo segmentas (51-100 kadrų), jis sustos klipo pabaigoje
            // Mums reikia užtikrinti, kad po uždarymo būtų nustatytas 0 laikas
            if (!isOpening && currentTime >= targetTime) {
                 modelViewer.pause();
                 isAnimating = false;
                 modelViewer.currentTime = targetTime; // Užtikriname, kad sustotų tiksliai 100 kadre (0 pozicija)
                 cancelAnimationFrame(animationMonitorId);
                 console.log('Sustabdyta ties uždarymo pabaiga (100 kadras / 0 pozicija).');
                 return;
            }


            animationMonitorId = requestAnimationFrame(checkAnimation);
        }


        function toggleAnimation(event) {
            if (isAnimating) return; 
            
            const button = event.currentTarget; 
            const animationName = button.getAttribute('data-animation-name');
            let isOpen = button.getAttribute('data-is-open') === 'true';

            if (!animationName) return;
            
            let timeRange;

            if (!isOpen) {
                // ATIDARYMAS
                timeRange = [0, OPEN_DURATION]; 
                modelViewer.currentTime = 0; // Pradeda nuo uždarytos pozicijos
                targetTime = OPEN_DURATION; // Tikslas: 50 kadras
                isOpening = true;
                
            } else {
                // UŽDARYMAS
                // Segmentas: 51-100 kadrai (nuo atidarytos iki uždarytos)
                timeRange = [OPEN_DURATION, TOTAL_DURATION]; 
                modelViewer.currentTime = OPEN_DURATION; // Pradeda nuo atidarytos pozicijos (50 kadro)
                targetTime = TOTAL_DURATION; // Tikslas: 100 kadras (uždaryta)
                isOpening = false;
            }
            
            try {
                isAnimating = true;
                
                modelViewer.play({ 
                    animationName: animationName, 
                    timeRange: timeRange,
                    duration: TARGET_DURATION, // Vykdoma per 0.5s
                    repetitions: 1,
                    direction: 'forwards' 
                });
                
                // Paleidžiame nuolatinį tikrinimą
                animationMonitorId = requestAnimationFrame(checkAnimation);
                
                // Atnaujiname mygtuko būseną ir tekstą
                button.setAttribute('data-is-open', (!isOpen).toString());
                button.textContent = isOpen ? `Atidaryti Stalčių 1` : `Uždaryti Stalčių 1`;
                button.classList.toggle('open', !isOpen);

            } catch (e) {
                 statusMessage.innerHTML = `❌ KLAIDA: Nepavyko paleisti animacijos.`;
                 statusMessage.style.backgroundColor = '#f44336';
                 statusMessage.style.display = 'block';
                 isAnimating = false; 
            }
        }
        
        if (toggleButton) {
            toggleButton.addEventListener('click', toggleAnimation);
        }

        // Pradinis modelio nustatymas: Uždaryta pozicija
        modelViewer.addEventListener('model-visibility', () => {
             const availableAnimations = modelViewer.availableAnimations || [];
             const animationName = toggleButton.getAttribute('data-animation-name');

             if (availableAnimations.includes(animationName)) {
                 modelViewer.animationName = animationName;
                 modelViewer.currentTime = 0; 
                 modelViewer.pause();
                 
                 statusMessage.innerHTML = `✅ Modelis paruoštas! Naudojamas RAF stebėjimas.`;
                 statusMessage.style.backgroundColor = '#4CAF50';
                 statusMessage.style.display = 'block';
             } else {
                 statusMessage.innerHTML = `❌ Animacija '${animationName}' nerasta.`;
                 statusMessage.style.backgroundColor = '#f44336';
                 statusMessage.style.display = 'block';
             }
        });
        
    </script>
</body>
</html>
