<!DOCTYPE html>
<html>
<head>
    <title>3D Spintelė - SHAPE KEY PAVADINIMŲ DIAGNOSTIKA</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        /* CSS Stiliai */
        body { margin: 0; padding: 0; height: 100vh; background-color: #f4f4f4; }
        .container { position: relative; width: 100%; height: 100vh; }
        
        model-viewer { 
            width: 100%; height: 100%; 
            background-color: #ffffff;
            --morph-target-transition-duration: 0.5s; 
        }
        
        /* Hotspot stilius */
        .hotspot-button {
            display: block; width: 30px; height: 30px; border: 4px solid white;
            border-radius: 50%; background-color: rgba(0, 123, 255, 0.8); 
            cursor: pointer; box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, background-color 0.2s;
        }
        .hotspot-button[data-is-open="true"] {
             background-color: rgba(40, 167, 69, 0.9);
        }
        .hotspot-button:hover {
            transform: scale(1.2);
        }

        /* Statuso pranešimas */
        #status-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            background: #333; color: white; padding: 10px 20px; border-radius: 5px; 
            z-index: 9999; font-weight: bold; text-align: center; display: none;
        }
        
        /* Shape Keys sąrašo vieta */
        #data-list {
            position: fixed; top: 10px; left: 10px; 
            background: #f8f9fa; border: 1px solid #ccc; 
            padding: 10px; border-radius: 5px; z-index: 9998;
            max-width: 300px; font-size: 14px; display: none;
        }
        #data-list span {
            display: block; margin-top: 5px; font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            id="spintele-model" 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelės modelis" 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1.0"
            exposure="1.0"
        >
            <!-- Hotspots remain linked to drawer index 1-6 -->
            <button class="hotspot-button" slot="hotspot-stalcius-1" data-position="-0.2 0.7 0.5" data-drawer-index="1" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-2" data-position="0.2 0.7 0.5" data-drawer-index="2" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-3" data-position="-0.2 0.5 0.5" data-drawer-index="3" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-4" data-position="0.2 0.5 0.5" data-drawer-index="4" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-5" data-position="-0.2 0.3 0.5" data-drawer-index="5" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-6" data-position="0.2 0.3 0.5" data-drawer-index="6" data-is-open="false"></button>
        </model-viewer>
        
        <div id="status-message"></div>
        <div id="data-list"></div>
    </div>

    <script>
        const modelViewer = document.getElementById('spintele-model');
        const hotspotButtons = document.querySelectorAll('.hotspot-button'); 
        const statusMessage = document.getElementById('status-message');
        const dataListDiv = document.getElementById('data-list');
        
        // >> CHANGED: Expecting names like Key1, Key2, Key3 <<
        let SHAPE_KEY_PREFIX = "Key"; 
        const SHAPE_KEY_SUFFIX = ""; 

        function toggleShapeKey(event) {
            const button = event.currentTarget; 
            const drawerIndex = button.getAttribute('data-drawer-index');
            let isOpen = button.getAttribute('data-is-open') === 'true';

            // Target name will now be Key1, Key2 etc.
            const targetShapeKey = SHAPE_KEY_PREFIX + drawerIndex + SHAPE_KEY_SUFFIX;
            
            let targetValue = isOpen ? 0.0 : 1.0; 
            let targetState = isOpen ? 'false' : 'true';
            
            try {
                 modelViewer.setMorphTargetWeight(targetShapeKey, targetValue);
                 button.setAttribute('data-is-open', targetState);
                 statusMessage.innerHTML = `✅ ${targetShapeKey} judėjimas sėkmingas.`;
                 statusMessage.style.backgroundColor = '#4CAF50'; 
                 statusMessage.style.display = 'block';
            } catch (error) {
                 console.error(`Klaida nustatant Shape Key "${targetShapeKey}": Pavadinimas neteisingas. Ar jis TIKSLIAI atitinka rasta pavadinima?`, error);
                 statusMessage.innerHTML = `❌ Klaida: Nepavyko rasti Shape Key: "${targetShapeKey}"`;
                 statusMessage.style.backgroundColor = '#dc3545';
                 statusMessage.style.display = 'block';
            }
        }
        
        function displayModelData() {
            let html = '<strong>Rasti Shape Keys Pavadinimai:</strong>';
            if (modelViewer.model && modelViewer.model.targetNames && modelViewer.model.targetNames.length > 0) {
                const foundKeys = modelViewer.model.targetNames; 
                foundKeys.forEach(key => { html += `<span>- ${key}</span>`; });
                html += `<span style="color: green; font-weight: bold; margin-top: 10px;">✅ Rasti ${foundKeys.length} Shape Keys.</span>`;
                console.log("Rasti Shape Keys:", foundKeys);
            } else {
                html += `<span style="color: red; font-weight: bold;">❌ Nė vienas Shape Key nerastas!</span>`;
                console.warn("Nepavyko rasti Shape Keys.");
            }
            dataListDiv.innerHTML = html;
            dataListDiv.style.display = 'block';
        }
        
        modelViewer.addEventListener('load', () => {
             setTimeout(() => {
                 displayModelData();
                 hotspotButtons.forEach(button => {
                     if(button) button.addEventListener('click', toggleShapeKey);
                 });
                 statusMessage.innerHTML = `✅ Modelis pilnai užkrautas. Patikrinkite kairėje esančius pavadinimus.`;
                 statusMessage.style.backgroundColor = '#4CAF50'; 
                 statusMessage.style.display = 'block';
             }, 100);
        });
        
        modelViewer.addEventListener('error', (event) => {
            statusMessage.innerHTML = `❌ Klaida įkeliantį modelį: ${event.detail}`;
            statusMessage.style.backgroundColor = '#dc3545'; 
            statusMessage.style.display = 'block';
            console.error('Model Viewer Error:', event.detail);
        });
    </script>
</body>
</html>
