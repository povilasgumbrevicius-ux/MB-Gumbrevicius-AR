<!DOCTYPE html>
<html>
<head>
    <title>3D Spintelė - ŠVARUS VALDYMAS V2</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        body { margin: 0; padding: 0; height: 100vh; }
        .container { position: relative; width: 100%; height: 100vh; }
        
        model-viewer { 
            width: 100%; height: 100%; 
        }

        /* Mygtukas viršuje kairėje */
        #main-control-button {
            position: fixed; 
            top: 30px; 
            left: 30px; 
            padding: 10px 20px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            transition: background-color 0.3s, opacity 0.3s;
        }

        #main-control-button:disabled {
             opacity: 0.5;
             cursor: default;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            id="spintele-model" 
            
            src="../modeliai/baldai/spintele.glb?v=2" 
            
            alt="Spintelės modelis" 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1.0"
            exposure="1.0"
            ar ar-modes="webxr scene-viewer quick-look"
            animation-crossfade-duration="0.3" 
        >
        </model-viewer>
        
        <button id="main-control-button" disabled>Laukiama įkrovimo...</button>

    </div>

    <script type="module">
        
        document.addEventListener('DOMContentLoaded', () => {
            const modelViewer = document.getElementById('spintele-model');
            const controlButton = document.getElementById('main-control-button'); 
            
            // JŪSŲ TIKSLŪS ANIMACIJOS PARAMETRAI
            const ANIMATION_NAME = "spinteleAction"; 
            const TOTAL_DURATION_SECONDS = 6.0; 
            const TOTAL_FRAMES = 144; 
            const OPEN_FRAME = 72; // Atidarymo taškas (3.0 sek.)
            
            const OPEN_TIME = (OPEN_FRAME / TOTAL_FRAMES) * TOTAL_DURATION_SECONDS; // 3.0 sek.
            const CLOSED_TIME = 0.0; // Visiškai uždarytas
            
            let isOpen = false;

            // --- ANIMACIJOS PALEIDIMO FUNKCIJA ---
            function toggleDrawerAnimation() {
                if (!modelViewer.model) return;
                
                const targetTime = isOpen ? CLOSED_TIME : OPEN_TIME; 

                if (!modelViewer.animationNames.includes(ANIMATION_NAME)) {
                     console.error(`Klaida: Animacija "${ANIMATION_NAME}" nerasta.`);
                     controlButton.textContent = "ANIMACIJA NERASTA!";
                     controlButton.style.backgroundColor = 'red';
                     return;
                }

                try {
                     modelViewer.animationName = ANIMATION_NAME;
                     
                     modelViewer.play({
                        duration: TOTAL_DURATION_SECONDS, 
                        time: targetTime, 
                        speed: 1, 
                        onEnd: () => {
                             modelViewer.pause(); 
                        }
                     });
                     
                     isOpen = !isOpen; 
                     controlButton.textContent = isOpen ? 'UŽDARYTI STALČIUS' : 'ATIDARYTI STALČIUS';

                } catch (error) {
                     console.error('Animacijos paleidimo klaida:', error);
                }
            }
            
            // --- INICIALIZACIJA IR PATIKRINIMAS ---
            modelViewer.addEventListener('load', () => {
                const animationNames = modelViewer.animationNames;

                if (animationNames.includes(ANIMATION_NAME)) {
                    // SĖKMĖ: Animacija rasta
                    controlButton.disabled = false;
                    controlButton.textContent = 'ATIDARYTI STALČIUS';
                    controlButton.addEventListener('click', toggleDrawerAnimation);
                    
                    // Nustatome pradinę būseną
                    modelViewer.animationName = ANIMATION_NAME;
                    modelViewer.currentTime = CLOSED_TIME; 
                    modelViewer.pause();

                } else {
                    // KLAIDA: Animacija nerasta
                    controlButton.textContent = `"${ANIMATION_NAME}" NERASTA`;
                    controlButton.style.backgroundColor = '#dc3545';
                }
            });
            
            modelViewer.addEventListener('error', (event) => {
                controlButton.textContent = 'KRITINĖ KLAIDA';
                controlButton.style.backgroundColor = '#dc3545';
                console.error('Kritinė modelio klaida:', event.detail);
            });

            controlButton.textContent = 'Laukiama modelio užkrovimo...';
        });
    </script>
</body>
</html>
