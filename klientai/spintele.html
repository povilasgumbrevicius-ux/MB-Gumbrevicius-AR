<!DOCTYPE html>
<html>
<head>
    <title>3D Spintelė - FINALINIS VEIKIANTIS KODAS + DIAGNOSTIKA</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        body { margin: 0; padding: 0; height: 100vh; }
        .container { position: relative; width: 100%; height: 100vh; }
        
        model-viewer { 
            width: 100%; height: 100%; 
            --node-operation-transition: 0.3s; 
        }
        
        /* Hotspot stiliai */
        .hotspot-button {
            display: block; width: 30px; height: 30px; border: 4px solid white;
            border-radius: 50%; background-color: rgba(0, 123, 255, 0.8);
            cursor: pointer; box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, background-color 0.2s;
        }
        .hotspot-button[data-is-open="true"] {
             background-color: rgba(40, 167, 69, 0.9);
        }
        .hotspot-button:hover {
            transform: scale(1.2);
        }

        /* Statuso pranešimas */
        #status-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            background: #333; color: white; padding: 10px 20px; border-radius: 5px; 
            z-index: 9999; font-weight: bold; text-align: center; display: none;
        }

        /* DIAGNOSTIKOS langelis viršuje kairėje */
        #node-list-display {
            position: fixed; 
            top: 10px; 
            left: 10px; 
            background: rgba(255, 255, 255, 0.9); 
            border: 2px solid #000;
            padding: 10px; 
            max-width: 300px;
            max-height: 80%;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            color: #333;
            z-index: 10000;
        }
        #node-list-display span {
            display: block;
            padding: 2px 0;
            cursor: pointer; /* Leidžiame juos paspausti bandymui */
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            id="spintele-model" 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelės modelis" 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1.0"
            exposure="1.0"
            ar ar-modes="webxr scene-viewer quick-look"
        >
            <button class="hotspot-button" slot="hotspot-stalcius-1" data-position="-0.2 0.7 0.5" data-drawer-index="1" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-2" data-position="0.2 0.7 0.5" data-drawer-index="2" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-3" data-position="-0.2 0.5 0.5" data-drawer-index="3" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-4" data-position="0.2 0.5 0.5" data-drawer-index="4" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-5" data-position="-0.2 0.3 0.5" data-drawer-index="5" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-6" data-position="0.2 0.3 0.5" data-drawer-index="6" data-is-open="false"></button>
        </model-viewer>
        
        <div id="node-list-display">Laukiama, kol modelis užsikraus...</div>
        <div id="status-message"></div>
    </div>

    <script type="module">
        const modelViewer = document.getElementById('spintele-model');
        const hotspotButtons = document.querySelectorAll('.hotspot-button'); 
        const statusMessage = document.getElementById('status-message');
        const nodeListDisplay = document.getElementById('node-list-display');
        
        // KRITINIAI NUSTATYMAI
        // Šis bus pataisytas, kai gausite pavadinimus
        let NODE_NAME_PREFIX = "stalcius"; 
        const OPEN_DISTANCE = 0.3; 
        const AXIS_INDEX = 2; // Z ašis

        // FUNKCIJA: Rasti VISUS modelio mazgus (Nodes) ir juos atvaizduoti
        function displayAndSetNodes() {
            if (!modelViewer.model) return;
            
            const root = modelViewer.model.target; 
            let nodeNames = [];
            let htmlContent = '<strong>RASTI PAVADINIMAI (Nodes):</strong><hr>';

            function traverseNodes(node) {
                if (node.name) {
                    nodeNames.push(node.name);
                    // Pavadinimas pridedamas kaip paspaudžiamas elementas diagnostikai
                    htmlContent += `<span data-node-name="${node.name}">${node.name}</span>`;
                }
                if (node.children) {
                    node.children.forEach(traverseNodes);
                }
            }
            
            traverseNodes(root);

            if (nodeNames.length > 0) {
                 nodeListDisplay.innerHTML = htmlContent;
                 statusMessage.innerHTML = '✅ Mazgų pavadinimai atvaizduoti viršuje kairėje. Dabar spauskite stalčius!';
                 statusMessage.style.backgroundColor = '#4CAF50'; 
            } else {
                 nodeListDisplay.innerHTML = '❌ Klaida: Jokie mazgai nerasti. Patikrinkite GLB eksportą.';
