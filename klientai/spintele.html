<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Spintelė – spausk stalčius kameroje</title>

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.min.js"></script>

    <style>
        body { margin:0; padding:0; overflow:hidden; font-family: system-ui, -apple-system, sans-serif; }
        
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
            background: rgba(0,0,0,0.9); color: white; padding: 14px 20px;
            text-align: center; font-size: 15px; line-height: 1.4;
        }
        .ar-instruction { color: #00ffaa; font-weight: 700; }

        .controls {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            z-index: 9999; background: rgba(0,0,0,0.92); color: white;
            padding: 14px 20px; border-radius: 18px; display: flex; flex-wrap: wrap;
            gap: 10px; max-width: 92%; box-shadow: 0 6px 25px rgba(0,0,0,0.5);
        }
        .controls button {
            background: #00d4ff; color: #000; border: none; padding: 13px 20px;
            border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer;
            box-shadow: 0 3px 12px rgba(0,212,255,0.4); transition: all 0.2s;
            min-width: 70px;
        }
        .controls button:active {
            transform: scale(0.94); background: #00b8e0;
        }
        .controls button.open {
            background: #00ff88;
        }
    </style>
</head>
<body>

    <div class="header">
        <strong>Atidarykite šį puslapį <span class="ar-instruction">tiesiog Google Chrome</span><br>
        (ne per WhatsApp, Gmail, Messenger ar kitą programėlę!)</strong>
    </div>

    <a-scene arjs="sourceType: webcam" embedded vr-mode-ui="enabled: false">

        <a-camera position="0 0 0">
            <a-cursor 
                raycaster="objects: .interactive; far: 10;" 
                fuse="false" 
                color="#00ffaa" 
                events="click"></a-cursor>
        </a-camera>

        <a-entity 
            id="spinta"
            gltf-model="https://ar.gumbrevicius.lt/modeliai/baldai/spintele.glb"
            position="0 0 -2.8"
            scale="1 1 1"
            class="interactive"
            tap-handler>
        </a-entity>

        <div class="controls">
            <button id="btn1" onclick="toggleStalcius(1)">1 stalčius</button>
            <button id="btn2" onclick="toggleStalcius(2)">2 stalčius</button>
            <button id="btn3" onclick="toggleStalcius(3)">3 stalčius</button>
            <button id="btn4" onclick="toggleStalcius(4)">4 stalčius</button>
            <button id="btn5" onclick="toggleStalcius(5)">5 stalčius</button>
            <button id="btn6" onclick="toggleStalcius(6)">6 stalčius</button>
        </div>

    </a-scene>

    <script>
        // Kiekvieno stalčiaus būsena: false = uždarytas, true = atidarytas
        const drawerState = { 1: false, 2: false, 3: false, 4: false, 5: false, 6: false };

        function toggleStalcius(nr) {
            const spinta = document.getElementById('spinta');
            const btn = document.getElementById('btn' + nr);
            if (!spinta) return;

            const isOpen = drawerState[nr];
            const timeScale = isOpen ? -1 : 1;

            spinta.setAttribute('animation-mixer', `clip: open_drawer${nr}; loop: once; timeScale: ${timeScale};`);

            drawerState[nr] = !isOpen;

            // Mygtuko spalva: žalia = atidarytas
            btn.classList.toggle('open', drawerState[nr]);
        }

        // Raycast – paspaudus ant stalčiaus tiesiog kameroje
        AFRAME.registerComponent('tap-handler', {
            init: function() {
                this.el.addEventListener('click', (evt) => {
                    if (!evt.detail.intersection) return;

                    const meshName = (evt.detail.intersection.object.name || '').toLowerCase();
                    console.log('Paspausta ant:', meshName);

                    for (let nr = 1; nr <= 6; nr++) {
                        if (meshName.includes('drawer' + nr)) {
                            toggleStalcius(nr);
                            break;
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
