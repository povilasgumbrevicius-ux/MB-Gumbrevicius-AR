<!DOCTYPE html>
<html>
<head>
    <title>3D Spintelė - STALČIŲ VALDYMAS</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        /* Bendrai nustatymai */
        body { margin: 0; padding: 0; height: 100vh; }
        .container { position: relative; width: 100%; height: 100vh; }
        
        model-viewer { 
            width: 100%; height: 100%; 
            /* Suteikiame perėjimui laiko, kad atidarymas būtų sklandus */
            --node-operation-transition: 0.3s; 
        }
        
        /* Hotspot stiliai */
        .hotspot-button {
            display: block; width: 30px; height: 30px; border: 4px solid white;
            border-radius: 50%; background-color: rgba(0, 123, 255, 0.8);
            cursor: pointer; box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, background-color 0.2s;
        }
        .hotspot-button[data-is-open="true"] {
             background-color: rgba(40, 167, 69, 0.9);
        }
        .hotspot-button:hover {
            transform: scale(1.2);
        }

        /* Statuso pranešimas */
        #status-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            background: #333; color: white; padding: 10px 20px; border-radius: 5px; 
            z-index: 9999; font-weight: bold; text-align: center; display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            id="spintele-model" 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelės modelis" 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1.0"
            exposure="1.0"
            ar ar-modes="webxr scene-viewer quick-look"
        >
            <button class="hotspot-button" slot="hotspot-stalcius-1" data-position="-0.2 0.7 0.5" data-drawer-index="1" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-2" data-position="0.2 0.7 0.5" data-drawer-index="2" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-3" data-position="-0.2 0.5 0.5" data-drawer-index="3" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-4" data-position="0.2 0.5 0.5" data-drawer-index="4" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-5" data-position="-0.2 0.3 0.5" data-drawer-index="5" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-6" data-position="0.2 0.3 0.5" data-drawer-index="6" data-is-open="false"></button>
        </model-viewer>
        
        <div id="status-message"></div>
        </div>

    <script type="module">
        const modelViewer = document.getElementById('spintele-model');
        const hotspotButtons = document.querySelectorAll('.hotspot-button'); 
        const statusMessage = document.getElementById('status-message');
        
        // KRITINIAI NUSTATYMAI
        const NODE_NAME_PREFIX = "stalcius"; // Turi būti su mažosiomis raidėmis
        const OPEN_DISTANCE = 0.3; // 0.3 metro
        const AXIS_INDEX = 2; // Z ašis (0=X, 1=Y, 2=Z)
        
        // Tiesioginė mazgo pozicijos valdymo funkcija
        function toggleDrawerTransform(event) {
            const button = event.currentTarget;
            const index = button.getAttribute('data-drawer-index');
            let isOpen = button.getAttribute('data-is-open') === 'true';

            // Tikslus objekto (Node) pavadinimas (pvz., "stalcius3")
            const targetNodeName = NODE_NAME_PREFIX + index;
            
            // Nustatome naują poslinkio vertę (0.3m arba 0m)
            const targetPos = isOpen ? 0.0 : OPEN_DISTANCE; 
            
            // Sukuriame [X, Y, Z] masyvą ir nustatome reikšmę į nustatytą ašį
            const translationVector = [0, 0, 0];
            translationVector[AXIS_INDEX] = targetPos;

            try {
                 modelViewer.mutateNodeTransform({ 
                     name: targetNodeName, 
                     translation: translationVector, 
                 });
                 
                 button.setAttribute('data-is-open', !isOpen ? 'true' : 'false');
                 
                 statusMessage.innerHTML = `✅ ${targetNodeName} atidaryta/uždaryta (${targetPos}m).`;
                 statusMessage.style.backgroundColor = '#4CAF50'; 
                 statusMessage.style.display = 'block';

            } catch (error) {
                 statusMessage.innerHTML = `❌ Klaida: Patikrinkite "${targetNodeName}" pavadinimą ir ašį (AXIS_INDEX).`;
                 statusMessage.style.backgroundColor = '#dc3545';
                 statusMessage.style.display = 'block';
                 console.error('Node Transform Error:', error);
            }
        }
        
        // Įvykių klausytojas modeliui užsikrovus
        modelViewer.addEventListener('load', () => {
             // Priskiriame Hotspot'ų klausytojus
             hotspotButtons.forEach(button => {
                 button.addEventListener('click', toggleDrawerTransform);
             });
             
             statusMessage.innerHTML = `✅ Modelis paruoštas. Spauskite stalčius.`;
             statusMessage.style.backgroundColor = '#333';
             statusMessage.style.display = 'block';
        });
        
        // Klaidos stebėjimas
        modelViewer.addEventListener('error', (event) => {
            statusMessage.innerHTML = `❌ Klaida įkeliant modelį: ${event.detail}`;
            statusMessage.style.backgroundColor = '#dc3545'; 
            statusMessage.style.display = 'block';
            console.error('Model Viewer Error:', event.detail);
        });
    </script>
</body>
</html>
