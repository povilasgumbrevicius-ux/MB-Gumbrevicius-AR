<!DOCTYPE html>
<html>
<head>
    <title>3D Spintelė - GALUTINIS KODAS</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="https://unpkg.com/@google/model-viewer@2.1.1/dist/model-viewer.min.js"></script>
    
    <style>
        /* CSS Stiliai (išlieka tie patys) */
        body { margin: 0; padding: 0; height: 100vh; background-color: #f4f4f4; }
        .container { position: relative; width: 100%; height: 100vh; }
        
        model-viewer { 
            width: 100%; height: 100%; 
            background-color: #ffffff;
            /* Užtikrina sklandų perėjimą tarp uždarytos ir atidarytos pozicijos */
            --morph-target-transition-duration: 0.5s; 
        }
        
        /* Hotspot stilius */
        .hotspot-button {
            display: block; width: 30px; height: 30px; border: 4px solid white;
            border-radius: 50%; background-color: rgba(0, 123, 255, 0.8); 
            cursor: pointer; box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, background-color 0.2s;
        }
        .hotspot-button[data-is-open="true"] {
             background-color: rgba(40, 167, 69, 0.9);
        }
        .hotspot-button:hover {
            transform: scale(1.2);
        }

        /* Statuso pranešimas (DEBUG) */
        #status-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            background: #333; color: white; padding: 10px 20px; border-radius: 5px; 
            z-index: 9999; font-weight: bold; text-align: center; display: none;
        }
        
        /* Shape Keys sąrašo stilius (išlieka patikrinimui) */
        #shape-keys-list {
            position: fixed; top: 10px; left: 10px; 
            background: #f8f9fa; border: 1px solid #ccc; 
            padding: 10px; border-radius: 5px; z-index: 9998;
            max-width: 300px; font-size: 14px; display: none; /* Paslėpiam, jei nebereikia */
        }
        #shape-keys-list span {
            display: block; margin-top: 5px; font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            id="spintele-model" 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelės modelis" 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1.0"
            exposure="1.0"
        >
            <button class="hotspot-button" slot="hotspot-stalcius-1" data-position="-0.2 0.7 0.5" data-drawer-index="1" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-2" data-position="0.2 0.7 0.5" data-drawer-index="2" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-3" data-position="-0.2 0.5 0.5" data-drawer-index="3" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-4" data-position="0.2 0.5 0.5" data-drawer-index="4" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-5" data-position="-0.2 0.3 0.5" data-drawer-index="5" data-is-open="false"></button>
            <button class="hotspot-button" slot="hotspot-stalcius-6" data-position="0.2 0.3 0.5" data-drawer-index="6" data-is-open="false"></button>
        </model-viewer>
        
        <div id="status-message"></div>
        <div id="shape-keys-list"></div>
    </div>

    <script>
        const modelViewer = document.getElementById('spintele-model');
        const hotspotButtons = document.querySelectorAll('.hotspot-button'); 
        const statusMessage = document.getElementById('status-message');
        const shapeKeysListDiv = document.getElementById('shape-keys-list');
        
        // KRITINĖ KONSTANTA: Jūsų Shape Key pavadinimo formatas (stalcius 1, stalcius 2...)
        const SHAPE_KEY_PREFIX = "stalcius "; // NAUDOJAME TARPA
        const SHAPE_KEY_SUFFIX = ""; 

        // PAGRINDINĖ FUNKCIJA: Valdymas per Shape Keys
        function toggleShapeKey(event) {
            const button = event.currentTarget; 
            const drawerIndex = button.getAttribute('data-drawer-index');
            let isOpen = button.getAttribute('data-is-open') === 'true';

            // Sukuriamas tikslus Shape Key pavadinimas (pvz., "stalcius 3")
            const targetShapeKey = SHAPE_KEY_PREFIX + drawerIndex + SHAPE_KEY_SUFFIX;
            
            let targetValue;
            let targetState;

            if (!isOpen) {
                targetValue = 1.0; // Atidaryta
                targetState = 'true';
            } else {
                targetValue = 0.0; // Uždaryta
                targetState = 'false';
            }
            
            // NAUDOJAMA TIKSLI MORPH TARGET FUNKCIJA: setMorphTargetWeight
            try {
                 modelViewer.setMorphTargetWeight(targetShapeKey, targetValue);
            } catch (error) {
                 // Ši klaida rodo, kad shape key pavadinimas vis dar neteisingas, 
                 // arba model-viewer jo neranda. Patikrinkite konsolę!
                 console.error(`Klaida nustatant Shape Key ${targetShapeKey}: Ar pavadinimas teisingas?`, error);
                 statusMessage.innerHTML = `❌ Klaida: Nustatant Shape Key nepavyko! Patikrinkite konsolę.`;
                 statusMessage.style.backgroundColor = '#dc3545';
            }
           
            button.setAttribute('data-is-open', targetState);
        }
        
        // PATAISYMAS: Naudojame 'load' įvykį, kad garantuotume visų duomenų prieinamumą
        modelViewer.addEventListener('load', () => {
             // 1. Atvaizduojame rastus Shape Keys (DEBUG)
             if (modelViewer.model && modelViewer.model.targetNames) {
                 const foundKeys = modelViewer.model.targetNames; 
                 let html = '<strong>Rasti Shape Keys (Morf. Tikslai):</strong>';
                 foundKeys.forEach(key => { html += `<span>- ${key}</span>`; });
                 html += foundKeys.length > 0 ? `<span style="color: green; font-weight: bold;">✅ Rasti ${foundKeys.length} Shape Keys.</span>` : `<span style="color: red; font-weight: bold;">❌ Nė vienas Shape Key nerastas!</span>`;
                 shapeKeysListDiv.innerHTML = html;
                 shapeKeysListDiv.style.display = 'block';
             }
             
             // 2. Priskiriame Hotspot'ų klausytojus (IŠSPRENDŽIA NEREAGAVIMO PROBLEMĄ)
             hotspotButtons.forEach(button => {
                 if(button) button.addEventListener('click', toggleShapeKey);
             });
             
             // 3. Vizualinis patvirtinimas
             statusMessage.innerHTML = `✅ Modelis pilnai užkrautas. Valdymas aktyvuotas.`;
             statusMessage.style.backgroundColor = '#4CAF50'; 
             statusMessage.style.display = 'block';
             
             // 4. Užtikriname, kad pradinė būsena būtų UŽDARYTA
             for (let i = 1; i <= 6; i++) {
                 const initialKey = SHAPE_KEY_PREFIX + i + SHAPE_KEY_SUFFIX;
                 modelViewer.setMorphTargetWeight(initialKey, 0.0);
             }
        });
        
        // Klaidos stebėjimas
        modelViewer.addEventListener('error', (event) => {
            statusMessage.innerHTML = `❌ Klaida įkeliant modelį: ${event.detail}`;
            statusMessage.style.backgroundColor = '#dc3545'; 
            console.error('Model Viewer Error:', event.detail);
        });
    </script>
</body>
</html>
