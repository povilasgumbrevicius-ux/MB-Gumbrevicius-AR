<!DOCTYPE html>
<html>
<head>
    <title>3D Spintelė - FINALINĖ SHAPE KEY DIAGNOSTIKA</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        
        body { margin: 0; padding: 0; height: 100vh; background-color: #f4f4f4; }
        .container { position: relative; width: 100%; height: 100vh; }
        model-viewer { 
            width: 100%; 
            height: 100%; 
            background-color: #ffffff;
            --camera-controls-touch-radius: 10px; 
            --camera-controls-move-speed: 2;
        }
        
        #ar-error-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            background: #ffc107; color: #333; padding: 10px 20px; border-radius: 5px; 
            z-index: 9999; font-weight: bold; display: none; text-align: center; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            id="spintele-model" 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelės modelis" 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1.0"
            exposure="1.0"
            
            ar
            ar-modes="webxr scene-viewer quick-look"
        >
            <button slot="ar-button" id="ar-custom-button">
                 ▶️ Rodyti AR
            </button>
        </model-viewer>
        
        <div id="ar-error-message"></div>
    </div>

    <script>
        const modelViewer = document.getElementById('spintele-model');
        const errorMessage = document.getElementById('ar-error-message');
        
        // **KRITINIS ĮVYKIS:** Tikriname, kai "plakatas" (poster) yra pašalintas
        modelViewer.addEventListener('poster-dismissed', () => {
             try {
                 // **KRITINIS TESTAS:** Bandome gauti Shape Key sąrašą
                 const morphTargets = modelViewer.model.morphTargetNames;
                 const expectedKey = 'stalcius1'; // Tikriname, ar mūsų raktas yra sąraše

                 if (morphTargets && morphTargets.length > 0) {
                     console.log('✅ SHAPE KEYS (Morfinių Tikslų) RASTI:');
                     console.log(morphTargets);

                     if (morphTargets.includes(expectedKey)) {
                         errorMessage.innerHTML = `✅ FANTASTIKA! Shape Key '${expectedKey}' RASTAS. Dabar galime valdyti stalčius.`;
                         errorMessage.style.backgroundColor = '#4CAF50';
                         errorMessage.style.color = 'white';
                         
                         // AUTOMATINIS STALČIAUS ATIDARYMAS TESTUI
                         // Kad įsitikintume, kad valdymas veikia
                         setTimeout(() => {
                            modelViewer.setAttribute(`morph-target-${expectedKey}`, 1.0);
                            console.log(`Stalčius '${expectedKey}' bando atsidaryti.`);
                         }, 1000);

                     } else {
                         errorMessage.innerHTML = `⚠️ Shape Keys rasti, bet trūksta '${expectedKey}'. Tikrinkite pavadinimą! Konsolėje rodomi rasti pavadinimai.`;
                         errorMessage.style.backgroundColor = '#ffc107';
                     }
                     
                 } else {
                     console.error('❌ GLB faile nerasta jokių Shape Keys (Morfinių Tikslų)!');
                     errorMessage.innerHTML = '❌ Klaida: Nėra Shape Keys. Patikrinkite GLB eksportą, net jei rodė gerai model-viewer.dev.';
                     errorMessage.style.backgroundColor = '#f44336';
                 }
             } catch (e) {
                 console.error('❌ Kritinė klaida Shape Key gavime:', e);
                 errorMessage.innerHTML = '❌ Modelis dingo arba įvyko klaida gaunant Shape Keys. Žr. F12 konsolę.';
                 errorMessage.style.backgroundColor = '#f44336';
             }
        });

        // AR Statusas paliktas dėl pilnumo
        modelViewer.addEventListener('ar-status', (event) => {
            const status = event.detail.status;
            const arCustomButton = document.getElementById('ar-custom-button');
            
            if (status === 'failed' || status === 'not-present' || status === 'unsupported') {
                errorMessage.style.display = 'block';
                if (arCustomButton) arCustomButton.style.display = 'none';
            } else {
                errorMessage.style.display = 'none';
                if (arCustomButton) arCustomButton.style.display = 'block';
            }
        });
        
    </script>
</body>
</html>
