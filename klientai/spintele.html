<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spintelė</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        /* CSS Stiliai */
        .container { position: relative; width: 100%; height: 100vh; }
        body { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; }
        
        model-viewer { 
            width: 100%; 
            height: 100%; 
            z-index: 100; 
            transform: translateZ(0); 
        }
        
        #ar-custom-button {
            background-color: #4CAF50; 
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        #ar-custom-button:hover {
            background-color: #45a049;
        }

        /* Stilius Stalčių Valdymo Mygtukui */
        #drawer-control-button {
            position: absolute; 
            top: 10px; 
            right: 10px; 
            z-index: 2500;
            background-color: #007bff; 
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        #drawer-control-button:hover {
            background-color: #0056b3;
        }
        #drawer-control-button:disabled {
            background-color: #adb5bd; 
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelė" 
            
            ar 
            ar-modes="scene-viewer quick-look webxr" 
            
            camera-controls 
            shadow-intensity="1" 
            exposure="1.0" 
            > 

            <button slot="ar-button" id="ar-custom-button" style="position: absolute; bottom: 10px; right: 10px; z-index: 2500;">
                 ▶️ Rodyti AR
            </button>

            <button id="drawer-control-button">
                 Atidaryti stalčius
            </button>
            
        </model-viewer>
        
    </div>

    <script>
        const modelViewer = document.querySelector('model-viewer');
        const controlButton = document.getElementById('drawer-control-button');
        
        // Būsena: false = Uždaryta (pradinė), true = Atidaryta
        let drawersOpen = false; 

        // ANIMACIJOS NUSTATYMAI (Valdoma sekundėmis)
        const ANIMATION_NAME = 'spinteleAction'; 

        // Atidarymas (0-72 kadrai = 0-3 sek.)
        const OPEN_START_TIME = 0.0; 
        const OPEN_END_TIME = 3.0; // Tiksliai 3 sekundės

        // Uždarymas (73-144 kadrai = 3-6 sek.)
        const CLOSE_START_TIME = 3.0; // Pradedame nuo 3 sekundės
        const CLOSE_END_TIME = 6.0; // Tiksliai 6 sekundės

        // Funkcija, kuri paleidžia animaciją pagal nurodytą laiko diapazoną
        function playAnimationSegment(startTime, endTime) {
            
            // Nustatome modelio pradinį laiką prieš paleidžiant animaciją
            modelViewer.currentTime = startTime; 
            modelViewer.animationName = ANIMATION_NAME;
            
            // Paleidžiame animaciją nustatytam laikotarpiui
            modelViewer.play({ 
                duration: endTime - startTime, 
            });
        }

        // Pagrindinis mygtuko paspaudimo tvarkyklė
        controlButton.addEventListener('click', () => {
            controlButton.disabled = true;

            if (drawersOpen) { 
                // UŽDARYMAS
                playAnimationSegment(CLOSE_START_TIME, CLOSE_END_TIME);
            } else { 
                // ATIDARYMAS
                playAnimationSegment(OPEN_START_TIME, OPEN_END_TIME);
            }
        });
        
        // Tvarkome, kai animacija pasibaigia (sustabdo ir atnaujina mygtuko būseną)
        modelViewer.addEventListener('animation-finished', () => {
             // Svarbu: Sustabdome modelį ties naujausio segmento pabaiga
             modelViewer.pause(); 
             
             // Keičiame būseną
             drawersOpen = !drawersOpen;

             // Atnaujiname mygtuko tekstą pagal naują būseną
             if (drawersOpen) { 
                 controlButton.textContent = 'Uždaryti stalčius';
             } else {
                 controlButton.textContent = 'Atidaryti stalčius';
             }
             
             // Įjungiame mygtuką atgal
             controlButton.disabled = false; 
        });

        // Inicializuojame modelį į uždarytą poziciją (0 sekundžių)
        modelViewer.addEventListener('load', () => {
            modelViewer.animationName = ANIMATION_NAME;
            modelViewer.currentTime = 0;
            modelViewer.pause();
        });
        
    </script>
</body>
</html>
