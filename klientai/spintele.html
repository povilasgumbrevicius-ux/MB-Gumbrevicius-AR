<!DOCTYPE html>
<html>
<head>
    <title>3D Spintelė</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        
        body { margin: 0; padding: 0; height: 100vh; background-color: #f4f4f4; }
        .container { position: relative; width: 100%; height: 100vh; }
        model-viewer { 
            width: 100%; 
            height: 100%; 
            background-color: #ffffff;
            --camera-controls-touch-radius: 10px; 
            --camera-controls-move-speed: 2;
        }

        #ar-custom-button {
            /* Stilius AR mygtukui (nekeistas) */
            background-color: #4CAF50; 
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
            position: absolute; 
            top: 40px; 
            right: 20px; 
            z-index: 2500;
        }
        #ar-custom-button:hover {
            background-color: #45a049;
        }

        /* NAUJAS STILIUS STALČIAUS MYGTUKUI */
        #toggle-drawer-button {
            background-color: #008CBA; 
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 2500;
        }
        #toggle-drawer-button:hover {
            background-color: #007bb5;
        }

        /* Klaidos pranešimas CSS */
        #ar-error-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            background: #ffc107; color: #333; padding: 10px 20px; border-radius: 5px; 
            z-index: 9999; font-weight: bold; display: none; text-align: center; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
        }
    </style>
</head>
<body>
    <div class="container">
        <model-viewer 
            id="spintele-model" 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelės modelis" 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1.0"
            exposure="1.0"
            disable-tap
            
            ar
            ar-modes="webxr scene-viewer quick-look"
        >
            <button slot="ar-button" id="ar-custom-button">
                 ▶️ Rodyti AR
            </button>
        </model-viewer>
        
        <button id="toggle-drawer-button">Atidaryti Stalčių</button>
        
        <div id="ar-error-message"></div>
    </div>

    <script>
        const modelViewer = document.getElementById('spintele-model');
        const errorMessage = document.getElementById('ar-error-message');
        
        // Klaidos/būsenos valdymas (Jūsų originalus kodas)
        modelViewer.addEventListener('ar-status', (event) => {
            const status = event.detail.status;
            const arCustomButton = document.getElementById('ar-custom-button');
            
            if (status === 'failed' || status === 'not-present' || status === 'unsupported') {
                errorMessage.innerHTML = '⚠️ Šis įrenginys nepalaiko Papildytosios Realybės (AR) funkcijos...';
                errorMessage.style.display = 'block';
                if (arCustomButton) arCustomButton.style.display = 'none'; // Paslėpti custom mygtuką
            } else {
                errorMessage.style.display = 'none';
                if (arCustomButton) arCustomButton.style.display = 'block'; // Rodyti custom mygtuką
            }
        });

        /* NAUJAS KODAS: STALČIAUS VALDYMAS */
        const toggleButton = document.getElementById('toggle-drawer-button');
        const SHAPE_KEY_NAME = 'stalcius1'; // Jūsų patvirtintas Shape Key pavadinimas
        let isDrawerOpen = false; // Pradžioje stalčius uždarytas
        
        function toggleDrawer() {
            // Nustatome tikslinę vertę: 1.0 atidaryti, 0.0 uždaryti
            const targetValue = isDrawerOpen ? 0.0 : 1.0;
            
            // model-viewer komanda Shape Key'aus vertei nustatyti (nuo 0 iki 1)
            modelViewer.setMorphTarget(SHAPE_KEY_NAME, targetValue);
            
            // Pakeičiame būseną ir mygtuko tekstą
            isDrawerOpen = !isDrawerOpen;
            toggleButton.textContent = isDrawerOpen ? 'Uždaryti Stalčių' : 'Atidaryti Stalčių';
        }

        // Laukiame, kol modelis pilnai užsikraus ir tada nustatome pradinę 0.0 vertę
        modelViewer.addEventListener('load', () => {
             // Užtikriname, kad stalčius būtų uždarytas iš pradžių, kad išvengtume atsitiktinio atidarymo
             modelViewer.setMorphTarget(SHAPE_KEY_NAME, 0.0);
        });

        // Prikabiname funkciją prie mygtuko paspaudimo
        toggleButton.addEventListener('click', toggleDrawer);
        
    </script>
</body>
</html>
