<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Spintelė AR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: system-ui; }

        #video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        #canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #status {
            position: fixed;
            top: 20px; left: 20px; right: 20px;
            background: rgba(0,0,0,0.65);
            color: #ffcc00;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 14px;
            text-align: center;
            z-index: 10;
            backdrop-filter: blur(8px);
            pointer-events: none;
        }

        #controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.6);
            padding: 12px 18px;
            border-radius: 60px;
            backdrop-filter: blur(12px);
            flex-wrap: wrap;
            justify-content: center;
            max-width: 92vw;
        }

        .drawer-btn {
            background: #ff9500;
            border: none;
            color: white;
            font-weight: 700;
            padding: 12px 18px;
            border-radius: 40px;
            font-size: 15px;
            cursor: pointer;
            min-width: 52px;
            transition: background 0.2s;
        }

        .drawer-btn.open { background: #34c759; }
        .drawer-btn:active { transform: scale(0.92); }

        #start-btn {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #007aff;
            color: white;
            border: none;
            padding: 18px 36px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 700;
            z-index: 20;
            cursor: pointer;
            box-shadow: 0 4px 24px rgba(0,122,255,0.5);
        }
    </style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="status">⏳ Spausk "Įjungti AR"</div>

<div id="controls">
    <button class="drawer-btn" data-anim="Drawer1">1</button>
    <button class="drawer-btn" data-anim="Drawer2">2</button>
    <button class="drawer-btn" data-anim="Drawer3">3</button>
    <button class="drawer-btn" data-anim="Drawer4">4</button>
    <button class="drawer-btn" data-anim="Drawer5">5</button>
    <button class="drawer-btn" data-anim="Drawer6">6</button>
</div>

<button id="start-btn">📷 Įjungti AR</button>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MODEL_PATH = '../modeliai/baldai/spintele.glb';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const status = document.getElementById('status');
const startBtn = document.getElementById('start-btn');

// Three.js setup
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0, 0.5, 1.5);
camera.lookAt(0, 0.3, 0);

// Šviesa
const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(2, 4, 2);
scene.add(dirLight);

// Animacijos
let mixer = null;
let actions = {};
let drawerState = {};
let clock = new THREE.Clock();

// Įkelti GLB
const loader = new GLTFLoader();
loader.load(
    MODEL_PATH,
    (gltf) => {
        const model = gltf.scene;
        model.position.set(0, -0.3, 0);
        model.scale.set(1, 1, 1);
        scene.add(model);

        mixer = new THREE.AnimationMixer(model);

        gltf.animations.forEach(clip => {
            const action = mixer.clipAction(clip);
            action.setLoop(THREE.LoopOnce, 1);
            action.clampWhenFinished = true;
            actions[clip.name] = action;
            drawerState[clip.name] = false;
            console.log('✅ Animacija:', clip.name);
        });

        const count = Object.keys(actions).length;
        status.textContent = `✅ Įkelta. ${count} animacijos. Spausk stalčių numerį!`;
    },
    (xhr) => {
        const pct = Math.round(xhr.loaded / xhr.total * 100);
        status.textContent = `⏳ Įkeliama... ${pct}%`;
    },
    (err) => {
        status.textContent = '❌ Klaida: ' + err.message;
        console.error(err);
    }
);

// Kamera
startBtn.addEventListener('click', async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' },
            audio: false
        });
        video.srcObject = stream;
        startBtn.style.display = 'none';
        status.textContent = '📷 AR aktyvus. Spausk stalčių numerį!';
    } catch (e) {
        status.textContent = '❌ Kamera neprieinama: ' + e.message;
    }
});

// Stalčių mygtukai
document.querySelectorAll('.drawer-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const animName = btn.getAttribute('data-anim');
        const action = actions[animName];

        if (!action) {
            status.textContent = `❌ "${animName}" nerasta. Turimos: ${Object.keys(actions).join(', ')}`;
            return;
        }

        const isOpen = drawerState[animName];

        if (!isOpen) {
            // Atidaryti
            action.timeScale = 1;
            action.reset();
            action.play();
            drawerState[animName] = true;
            btn.classList.add('open');
            status.textContent = `🟢 Stalčius ${animName} atsidarė`;
        } else {
            // Uždaryti - animacija atgal
            action.timeScale = -1;
            action.paused = false;
            drawerState[animName] = false;
            btn.classList.remove('open');
            status.textContent = `🔴 Stalčius ${animName} užsidaro`;
        }
    });
});

// Resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Render loop
function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    if (mixer) mixer.update(delta);
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
