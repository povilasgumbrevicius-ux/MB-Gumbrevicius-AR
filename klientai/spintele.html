<!DOCTYPE html>
<html>
<head>
    <title>3D Spintelė - Shape Key Diagnostika II</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        /* Stiliai tokie patys kaip anksčiau */
        body { margin: 0; padding: 0; height: 100vh; background-color: #f4f4f4; }
        .container { position: relative; width: 100%; height: 100vh; }
        model-viewer { 
            width: 100%; 
            height: 100%; 
            background-color: #ffffff;
            --camera-controls-touch-radius: 10px; 
            --camera-controls-move-speed: 2;
        }

        #ar-custom-button {
            background-color: #4CAF50; 
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            position: absolute; 
            top: 40px; 
            right: 20px; 
            z-index: 2500;
        }
        
        #ar-error-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            background: #ffc107; color: #333; padding: 10px 20px; border-radius: 5px; 
            z-index: 9999; font-weight: bold; display: none; text-align: center; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            id="spintele-model" 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelės modelis" 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1.0"
            exposure="1.0"
            disable-tap
            
            ar
            ar-modes="webxr scene-viewer quick-look"
        >
            <button slot="ar-button" id="ar-custom-button">
                 ▶️ Rodyti AR
            </button>
        </model-viewer>
        
        <div id="ar-error-message"></div>
    </div>

    <script>
        const modelViewer = document.getElementById('spintele-model');
        const errorMessage = document.getElementById('ar-error-message');
        
        // MODELIO ĮKĖLIMO NUSTATYMAI
        modelViewer.addEventListener('load', () => {
             try {
                 // **KRITINIS TESTAS:** Bandome gauti Shape Key sąrašą
                 const morphTargets = modelViewer.model.morphTargetNames;

                 if (morphTargets && morphTargets.length > 0) {
                     console.log('✅ Rastos Shape Keys (Morfinių Tikslų) savybės:');
                     console.log(morphTargets);
                     
                     errorMessage.innerHTML = '✅ Modelis matomas. Shape Keys rasti. Atidarykite F12 Konsolę, kad pamatytumėte pavadinimus.';
                     errorMessage.style.display = 'block';

                 } else {
                     console.warn('⚠️ Modelis matomas, bet Shape Keys nerasti.');
                     errorMessage.innerHTML = '⚠️ Modelis matomas, bet Shape Keys nerasti. Patikrinkite GLB eksportą.';
                     errorMessage.style.display = 'block';
                 }
             } catch (e) {
                 console.error('❌ Kritinė klaida gaunant Shape Key pavadinimus:', e);
                 errorMessage.innerHTML = '❌ Modelis dingo arba įvyko klaida bandant gauti Shape Keys.';
                 errorMessage.style.display = 'block';
             }
        });

        // Klaidos/būsenos valdymas
        modelViewer.addEventListener('ar-status', (event) => {
            const status = event.detail.status;
            const arCustomButton = document.getElementById('ar-custom-button');
            
            if (status === 'failed' || status === 'not-present' || status === 'unsupported') {
                errorMessage.style.display = 'block';
                if (arCustomButton) arCustomButton.style.display = 'none';
            } else {
                errorMessage.style.display = 'none';
                if (arCustomButton) arCustomButton.style.display = 'block';
            }
        });
        
    </script>
</body>
</html>
