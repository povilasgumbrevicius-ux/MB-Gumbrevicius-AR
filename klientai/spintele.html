<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Spintelė AR - Babylon.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: system-ui;
        }
        #controls {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 100;
            background: rgba(0,0,0,0.6);
            padding: 12px 20px;
            border-radius: 60px;
            backdrop-filter: blur(10px);
        }
        .drawer-btn {
            background: #ff9500;
            border: none;
            color: white;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 60px;
        }
        .drawer-btn.open {
            background: #34c759;
        }
        .drawer-btn:active {
            transform: scale(0.94);
        }
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: #ffcc00;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 14px;
            text-align: center;
            z-index: 100;
            backdrop-filter: blur(8px);
            pointer-events: none;
        }
        #ar-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #007aff;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            z-index: 100;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="status">✅ Pasiruošęs. Spausk "Įjungti AR"</div>
    <div id="controls">
        <button class="drawer-btn" data-drawer="Drawer1">📦 1</button>
        <button class="drawer-btn" data-drawer="Drawer2">📦 2</button>
        <button class="drawer-btn" data-drawer="Drawer3">📦 3</button>
        <button class="drawer-btn" data-drawer="Drawer4">📦 4</button>
        <button class="drawer-btn" data-drawer="Drawer5">📦 5</button>
        <button class="drawer-btn" data-drawer="Drawer6">📦 6</button>
    </div>
    <button id="ar-button">🔘 Įjungti AR (kamera)</button>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/xr/babylon.xr.js"></script>

    <script>
        const canvas = document.createElement('canvas');
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        document.body.appendChild(canvas);
        
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        
        // Kamera (ne AR)
        const camera = new BABYLON.ArcRotateCamera('camera', -Math.PI/2, Math.PI/3, 2, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        
        // Šviesa
        const light = new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0, 1, 0), scene);
        light.intensity = 0.8;
        
        const MODEL_URL = '../modeliai/baldai/spintele.glb';
        let drawerGroups = new Map();
        
        // Įkelti GLB
        BABYLON.SceneLoader.LoadAssetContainerAsync(MODEL_URL, scene, (container) => {
            container.addAllToScene();
            
            // Rasti animacijų grupes
            container.animationGroups.forEach(group => {
                const name = group.name;
                if (name && name.includes('Drawer')) {
                    group.stop();
                    group.reset();
                    drawerGroups.set(name, group);
                    console.log('✅ Animacija:', name);
                }
            });
            
            // Patikrinti ar objektai yra
            scene.meshes.forEach(mesh => {
                if (mesh.name && mesh.name.includes('Drawer')) {
                    console.log('Objektas:', mesh.name);
                }
            });
            
            document.getElementById('status').innerHTML = `✅ Įkelta. Rasta ${drawerGroups.size} animacijų.`;
        });
        
        // AR mygtukas
        const arButton = document.getElementById('ar-button');
        let xrHelper = null;
        
        arButton.addEventListener('click', async () => {
            if (!xrHelper) {
                const xr = await scene.createDefaultXRExperienceAsync({
                    uiOptions: {
                        sessionMode: 'immersive-ar',
                        referenceSpaceType: 'local-floor'
                    }
                });
                xrHelper = xr;
                arButton.textContent = '🔘 AR aktyvus';
                arButton.style.background = '#34c759';
                document.getElementById('status').innerHTML = '🔘 AR režimas. Spausk stalčius!';
                
                // Pritaikyti modelio padėtį AR
                if (scene.meshes.length > 0) {
                    scene.meshes.forEach(mesh => {
                        if (mesh.name === 'Spintele' || mesh.name.includes('Drawer')) {
                            mesh.position.y = -0.3;
                        }
                    });
                }
            } else {
                // Jei jau aktyvuota
                document.getElementById('status').innerHTML = '🔘 AR jau aktyvus. Spausk stalčius!';
            }
        });
        
        // Mygtukai
        document.querySelectorAll('.drawer-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const drawerName = btn.getAttribute('data-drawer');
                const group = drawerGroups.get(drawerName);
                
                if (!group) {
                    document.getElementById('status').innerHTML = `❌ Stalčius ${drawerName} neturi animacijos`;
                    return;
                }
                
                if (btn.classList.contains('open')) {
                    // Uždaryti
                    group.stop();
                    group.reset();
                    btn.classList.remove('open');
                    document.getElementById('status').innerHTML = `🚪 Stalčius ${drawerName} užsidaro...`;
                } else {
                    // Atidaryti
                    group.start(true);
                    btn.classList.add('open');
                    document.getElementById('status').innerHTML = `🚪 Stalčius ${drawerName} atsidaro...`;
                }
                
                setTimeout(() => {
                    if (document.getElementById('status').innerHTML.includes(drawerName)) {
                        document.getElementById('status').innerHTML = '🔘 Spausk stalčius arba AR.';
                    }
                }, 2500);
            });
        });
        
        engine.runRenderLoop(() => scene.render());
        window.addEventListener('resize', () => engine.resize());
    </script>
</body>
</html>
