<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spintelė</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        /* CSS Stiliai (palikti nepakeisti) */
        .container { position: relative; width: 100%; height: 100vh; }
        body { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; }
        
        model-viewer { 
            width: 100%; 
            height: 100%; 
            z-index: 100; 
            transform: translateZ(0); 
        }
        
        #ar-custom-button {
            background-color: #4CAF50; color: white; padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; transition: background-color 0.3s;
        }
        #ar-custom-button:hover {
            background-color: #45a049;
        }
        #drawer-control-button {
            position: absolute; top: 10px; right: 10px; z-index: 2500; background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background-color 0.3s; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        #drawer-control-button:hover {
            background-color: #0056b3;
        }
        #drawer-control-button:disabled {
            background-color: #adb5bd; cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelė" 
            
            ar 
            ar-modes="scene-viewer quick-look webxr" 
            
            camera-controls 
            shadow-intensity="1" 
            exposure="1.0" 
            > 

            <button slot="ar-button" id="ar-custom-button" style="position: absolute; bottom: 10px; right: 10px; z-index: 2500;">
                 ▶️ Rodyti AR
            </button>

            <button id="drawer-control-button">
                 Atidaryti stalčius
            </button>
            
        </model-viewer>
        
    </div>

    <script>
        const modelViewer = document.querySelector('model-viewer');
        const controlButton = document.getElementById('drawer-control-button');
        
        // Būsena: false = Uždaryta (pradinė), true = Atidaryta
        let drawersOpen = false; 

        // ANIMACIJOS NUSTATYMAI (Laikas sekundėmis)
        const ANIMATION_NAME = 'spinteleAction'; 
        
        // Atidarymas (0-3 sek.)
        const OPEN_START_TIME = 0.0; 
        const OPEN_END_TIME = 3.0; 

        // Uždarymas (3-6 sek.)
        const CLOSE_START_TIME = 3.0; 
        const CLOSE_END_TIME = 6.0; 

        // Paleidžia animacijos segmentą
        function playAnimationSegment(startTime, endTime) {
            
            // Išjungiame mygtuką, kol vyksta animacija
            controlButton.disabled = true;

            // Nustatome modelio pradinį laiką ir animacijos pavadinimą
            modelViewer.currentTime = startTime; 
            modelViewer.animationName = ANIMATION_NAME;
            
            // Paleidžiame animaciją nustatytam laikotarpiui
            modelViewer.play({ 
                duration: endTime - startTime, 
            });
        }

        // Pagrindinis mygtuko paspaudimo tvarkyklė
        controlButton.addEventListener('click', () => {
            if (drawersOpen) { 
                // Jei ATIDARYTA, paleidžiame UŽDARYMO segmentą (3s iki 6s)
                playAnimationSegment(CLOSE_START_TIME, CLOSE_END_TIME);
            } else { 
                // Jei UŽDARYTA, paleidžiame ATIDARYMO segmentą (0s iki 3s)
                playAnimationSegment(OPEN_START_TIME, OPEN_END_TIME);
            }
        });
        
        // Tvarkome, kai animacija pasibaigia (sustabdo ir atnaujina būseną)
        modelViewer.addEventListener('animation-finished', () => {
             // Sustabdome modelį, kad liktų galutinėje padėtyje
             modelViewer.pause(); 
             
             // Keičiame būseną
             drawersOpen = !drawersOpen;

             // Atnaujiname mygtuko tekstą pagal naują būseną
             if (drawersOpen) { 
                 // Jei dabar atidaryta
                 controlButton.textContent = 'Uždaryti stalčius';
             } else {
                 // Jei dabar uždaryta, RESETINAME į 0 sekundę, kad būtų galima vėl atidaryti.
                 modelViewer.currentTime = OPEN_START_TIME;
                 controlButton.textContent = 'Atidaryti stalčius';
             }
             
             // Įjungiame mygtuką atgal
             controlButton.disabled = false; 
        });

        // Inicializuojame modelį į uždarytą poziciją (0 sekundžių) vos užsikrovus
        modelViewer.addEventListener('load', () => {
            modelViewer.animationName = ANIMATION_NAME;
            modelViewer.currentTime = OPEN_START_TIME; // 0s
            modelViewer.pause();
        });
        
    </script>
</body>
</html>
