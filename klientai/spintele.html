<!DOCTYPE html>
<html>
<head>
    <title>3D Spintelė - KRITINĖ DIAGNOZĖ (Pavadinimai)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        body { margin: 0; padding: 0; height: 100vh; }
        .container { position: relative; width: 100%; height: 100vh; }
        model-viewer { width: 100%; height: 100%; }
        
        /* Statuso pranešimas */
        #status-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            background: #333; color: white; padding: 10px 20px; border-radius: 5px; 
            z-index: 9999; font-weight: bold; text-align: center; 
        }

        /* Naujas langelis pavadinimų atvaizdavimui */
        #node-list-display {
            position: fixed; 
            top: 10px; 
            left: 10px; 
            background: rgba(255, 255, 255, 0.9); 
            border: 2px solid #000;
            padding: 10px; 
            max-width: 300px;
            max-height: 80%;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            color: #333;
            z-index: 10000;
        }
        #node-list-display span {
            display: block;
            padding: 2px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            id="spintele-model" 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelės modelis" 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1.0"
            exposure="1.0"
        >
        </model-viewer>
        
        <div id="node-list-display">Laukiama, kol modelis užsikraus...</div>
        <div id="status-message"></div>
    </div>

    <script type="module">
        const modelViewer = document.getElementById('spintele-model');
        const statusMessage = document.getElementById('status-message');
        const nodeListDisplay = document.getElementById('node-list-display');
        
        // KRITINĖ DIAGNOSTIKA: Rasti VISUS modelio mazgus (Nodes) ir juos atvaizduoti
        function displayAllNodeNames() {
             
            if (!modelViewer.model) {
                 nodeListDisplay.innerHTML = '❌ Modelis dar neįkeltas. Patikrinkite kelio nuorodą.';
                 return;
            }
            
            const root = modelViewer.model.target; 
            let nodeNames = [];
            let htmlContent = '<strong>RASTI MAZGŲ PAVADINIMAI (Node Names):</strong><hr>';

            // Rekursinė funkcija, skirta pereiti per visus mazgus (Nodes) ir juos surinkti
            function traverseNodes(node) {
                if (node.name) {
                    nodeNames.push(node.name);
                    htmlContent += `<span>${node.name}</span>`;
                }
                if (node.children) {
                    node.children.forEach(traverseNodes);
                }
            }
            
            traverseNodes(root);

            if (nodeNames.length > 0) {
                 nodeListDisplay.innerHTML = htmlContent;
                 statusMessage.innerHTML = '✅ Mazgų pavadinimai atvaizduoti viršuje kairėje. Nukopijuokite ir atsiųskite man visą sąrašą!';
                 statusMessage.style.backgroundColor = '#4CAF50'; 
            } else {
                 nodeListDisplay.innerHTML = '❌ Klaida: Jokie mazgai nerasti modelyje. Gali būti klaida GLB eksporte.';
                 statusMessage.innerHTML = '❌ Klaida: Jokių mazgų nerasta.';
                 statusMessage.style.backgroundColor = '#dc3545';
            }
        }
        
        // Paleidžiame diagnostiką modeliui užsikrovus
        modelViewer.addEventListener('load', displayAllNodeNames);
        
        modelViewer.addEventListener('error', (event) => {
            statusMessage.innerHTML = `❌ Klaida įkeliant modelį: ${event.detail}`;
            statusMessage.style.backgroundColor = '#dc3545'; 
            console.error('Model Viewer Error:', event.detail);
        });
    </script>
</body>
</html>
