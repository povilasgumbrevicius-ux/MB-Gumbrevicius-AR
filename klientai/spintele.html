<!DOCTYPE html>
<html>
<head>
    <title>3D Spintelė - FINALINIS VEIKIANTIS KODAS + DIAGNOSTIKA</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        body { margin: 0; padding: 0; height: 100vh; }
        .container { position: relative; width: 100%; height: 100vh; }
        
        model-viewer { 
            width: 100%; height: 100%; 
            --node-operation-transition: 0.3s; 
        }
        
        /* Hotspot stiliai */
        .hotspot-button {
            display: block; width: 30px; height: 30px; border: 4px solid white;
            border-radius: 50%; background-color: rgba(0, 123, 255, 0.8);
            cursor: pointer; box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, background-color 0.2s;
        }
        .hotspot-button[data-is-open="true"] {
             background-color: rgba(40, 167, 69, 0.9);
        }
        .hotspot-button:hover {
            transform: scale(1.2);
        }

        /* Statuso pranešimas */
        #status-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            background: #333; color: white; padding: 10px 20px; border-radius: 5px; 
            z-index: 9999; font-weight: bold; text-align: center; display: block;
        }

        /* DIAGNOSTIKOS langelis viršuje kairėje */
        #node-list-display {
            position: fixed; 
            top: 10px; 
            left: 10px; 
            background: rgba(255, 255, 255, 0.9); 
            border: 2px solid #000;
            padding: 10px; 
            max-width: 300px;
            max-height: 80%;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            color: #333;
            z-index: 10000;
        }
        #node-list-display span {
            display: block;
            padding: 2px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            id="spintele-model" 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelės modelis" 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1.0"
            exposure="1.0"
            ar ar-modes="webxr scene-viewer quick-look"
        >
            <button class="hotspot-button" slot="hotspot-stalcius-1" data-position="-0.2 0.7 0.5" data-drawer-index="1" data-is-open="false"></
