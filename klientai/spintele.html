<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spintelė</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        /* CSS Stiliai */
        .container { position: relative; width: 100%; height: 100vh; }
        body { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; }
        
        /* Pagrindinis Model-Viewer stilius */
        model-viewer { 
            width: 100%; 
            height: 100%; 
            z-index: 100; 
            transform: translateZ(0); 
        }
        
        /* Stilius AR Mygtukui (minimalistinis pavyzdys, kad būtų matomas) */
        #ar-custom-button {
            background-color: #4CAF50; /* Žalia spalva */
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        #ar-custom-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelė" 
            
            ar 
            ar-modes="scene-viewer quick-look webxr" 
            
            camera-controls 
            shadow-intensity="1" 
            exposure="1.0" 
            auto-rotate>

            <button slot="ar-button" id="ar-custom-button" style="position: absolute; bottom: 10px; right: 10px; z-index: 2500;">
                 ▶️ Rodyti AR
            </button>
            
        </model-viewer>
        
    </div>

    <script>
        
    </script>
</body>
</html>
