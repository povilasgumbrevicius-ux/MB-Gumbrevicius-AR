<!DOCTYPE html>
<html>
<head>
    <title>Spintelė</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        /* CSS Stiliai */
        body { margin: 0; padding: 0; height: 100vh; background-color: #f4f4f4; }
        .container { position: relative; width: 100%; height: 100vh; }
        model-viewer { 
            width: 100%; height: 100%; background-color: #ffffff; --camera-controls-touch-radius: 10px; --camera-controls-move-speed: 2;
        }

        /* Mygtukų stiliai */
        #controls-overlay {
            position: absolute; top: 40px; right: 10px; z-index: 2500;
        }
        .drawer-button {
            padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background-color 0.2s;
        }
        .drawer-button.open { background-color: #28a745; }
        .drawer-button:hover { background-color: #0056b3; }
        
        #ar-custom-button {
            z-index: 3000; position: absolute; bottom: 40px; right: 10px; background-color: #4CAF50; color: white; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; transition: background-color 0.3s;
        }
        #status-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); background: #ffc107; color: #333; padding: 10px 20px; border-radius: 5px; z-index: 9999; font-weight: bold; display: none; text-align: center; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div id="controls-overlay">
            <button id="toggle-spintele-animation" class="drawer-button" data-animation-name="spinteleAction" data-is-open="false">
                Atidaryti stalčius
            </button>
        </div>

        <model-viewer 
            id="spintele-model" 
            src="../modeliai/baldai/spintele.glb" 
            alt="Spintelė" 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1.0"
            exposure="1.0"
            ar ar-modes="webxr scene-viewer quick-look"
        >
            <button slot="ar-button" id="ar-custom-button">
                 ▶️ Rodyti AR
            </button>
        </model-viewer>
        
        <div id="status-message"></div>
    </div>

    <script>
        const modelViewer = document.getElementById('spintele-model');
        const statusMessage = document.getElementById('status-message');
        const toggleButton = document.getElementById('toggle-spintele-animation');
        
        // Animacijos nustatymai:
        const ANIMATION_NAME = 'spinteleAction'; 
        const FPS = 24.0; 
        const OPEN_FRAMES = 72.0; 
        const CLOSE_FRAMES = 72.0; 
        
        const OPEN_DURATION = OPEN_FRAMES / FPS; // 3.0 s
        const TOTAL_DURATION = (OPEN_FRAMES + CLOSE_FRAMES) / FPS; // 6.0 s
        
        // Laiko konstantos (Pataisymas)
        const OPEN_START_TIME = 0.0;
        const CLOSE_START_TIME = OPEN_DURATION; // 3.0s
        const CLOSE_END_TIME = TOTAL_DURATION; // 6.0s
        
        const TIME_EPSILON = 0.01; // Tolerancija plaukiojančio kablelio klaidoms
        
        let isAnimating = false;
        let animationMonitorId = null;
        let targetTime = 0; 
        let isOpening = false; 

        // Svarbiausia funkcija: Stebi animacijos eigą ir sustabdo ją tiksliai
        function checkAnimation() {
            if (!isAnimating) {
                cancelAnimationFrame(animationMonitorId);
                return;
            }

            const currentTime = modelViewer.currentTime; 
            
            if (isOpening) {
                // Atidarymas (Tikslas: 3.0 s)
                if (currentTime >= targetTime - TIME_EPSILON) {
                    modelViewer.pause();
                    modelViewer.currentTime = targetTime; 
                    isAnimating = false; 
                    cancelAnimationFrame(animationMonitorId);
                    return;
                }
            } else {
                // Uždarymas (Tikslas: 6.0 s)
                if (currentTime >= targetTime - TIME_EPSILON) {
                    modelViewer.pause();
                    modelViewer.currentTime = OPEN_START_TIME; // RESETINAME į 0.0s (uždaryta)
                    isAnimating = false; 
                    cancelAnimationFrame(animationMonitorId);
                    return;
                }
            }

            animationMonitorId = requestAnimationFrame(checkAnimation);
        }

        function toggleAnimation(event) {
            if (isAnimating) return; 
            
            const button = event.currentTarget; 
            const animationName = button.getAttribute('data-animation-name');
            let isOpen = button.getAttribute('data-is-open') === 'true';

            if (!animationName) return;
            
            let startTime, endTime;

            if (!isOpen) {
                // ATIDARYMAS: 0.0s iki 3.0s
                startTime = OPEN_START_TIME; 
                endTime = OPEN_DURATION; 
                modelViewer.currentTime = startTime; 
                targetTime = endTime; // Tikslas: 3.0s
                isOpening = true;
                
            } else {
                // UŽDARYMAS: 3.0s iki 6.0s
                startTime = CLOSE_START_TIME; 
                endTime = CLOSE_END_TIME; 
                modelViewer.currentTime = startTime; // Pradeda nuo 3.0s
                targetTime = endTime; // Tikslas: 6.0s
                isOpening = false;
            }
            
            try {
                isAnimating = true; // Blokuojame kitus paspaudimus
                
                modelViewer.play({ 
                    animationName: animationName, 
                    timeRange: [startTime, endTime],
                    duration: (endTime - startTime), 
                    repetitions: 1,
                    direction: 'forwards' 
                });
                
                animationMonitorId = requestAnimationFrame(checkAnimation);
                
                button.setAttribute('data-is-open', (!isOpen).toString());
                button.textContent = isOpen ? `Atidaryti stalčius` : `Uždaryti stalčius`;
                button.classList.toggle('open', !isOpen);

            } catch (e) {
                 console.error("Animacijos klaida:", e);
                 statusMessage.innerHTML = `❌ KLAIDA: Nepavyko paleisti animacijos. Patikrinkite animacijos pavadinimą.`;
                 statusMessage.style.backgroundColor = '#f44336';
                 statusMessage.style.display = 'block';
                 isAnimating = false; 
            }
        }
        
        if (toggleButton) {
            toggleButton.addEventListener('click', toggleAnimation);
        }

        // Pradinis modelio nustatymas: Uždaryta pozicija
        modelViewer.addEventListener('model-visibility', () => {
             const animationName = toggleButton.getAttribute('data-animation-name');
             const availableAnimations = modelViewer.availableAnimations || [];

             if (availableAnimations.includes(animationName)) {
                 modelViewer.animationName = animationName;
                 modelViewer.currentTime = OPEN_START_TIME; // 0.0s
                 modelViewer.pause();
             } else {
                 statusMessage.innerHTML = `❌ Animacija '${animationName}' nerasta. Galimi pavadinimai: ${availableAnimations.join(', ')}.`;
                 statusMessage.style.backgroundColor = '#f44336';
                 statusMessage.style.display = 'block';
             }
        });
        
    </script>
</body>
</html>
