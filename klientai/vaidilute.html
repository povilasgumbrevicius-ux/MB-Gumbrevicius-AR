<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR Peržiūra - Paveikslas Vaidilute (Keičiamas dydis)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        .container { position: relative; width: 100%; height: 100vh; }
        body { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100%; z-index: 100; }
        
        #size-controls {
            position: absolute; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 2500;
            display: none; /* Pradžioje paslėpti, rodyti tik kai AR palaikoma */
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .size-button {
            background-color: #f8f9fa;
            color: #343a40;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s;
        }

        .size-button:hover {
            background-color: #e2e6ea;
            transform: scale(1.05);
        }
        
        .size-button.active {
            background-color: #007bff;
            color: white;
            box-shadow: 0 0 5px #007bff;
        }

        #ar-error-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            background: #ffc107; color: #333; padding: 10px 20px; border-radius: 5px; 
            z-index: 9999; font-weight: bold; display: none; text-align: center; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
        }

        #ar-custom-button {
            background-color: #4CAF50; 
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
            position: absolute; 
            top: 40px; 
            right: 20px; 
            z-index: 2500;
        }
        #ar-custom-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            id="ar-resizable-model"
            
            src="../modeliai/dekoras/vaidilute.glb"
            alt="Paveikslas Vaidilute" 
            
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            
            camera-controls 
            camera-orbit="0 75deg 1.5m" 
            shadow-intensity="1" 
            exposure="1.0" 
            
            data-current-scale="1.0" 
            
            disable-tap
        >
            <button slot="ar-button" id="ar-custom-button">
                ▶️ Rodyti AR
            </button>
            
            <div id="size-controls">
                <button class="size-button active" data-scale="1.0">100% (1x)</button>
                <button class="size-button" data-scale="0.8">80% (0.8x)</button>
                <button class="size-button" data-scale="0.6">60% (0.6x)</button>
                <button class="size-button" data-scale="0.4">40% (0.4x)</button>
            </div>
            
        </model-viewer>
        
    </div>

    <div id="ar-error-message"></div>

    <script>
        const modelViewer = document.querySelector('#ar-resizable-model');
        const errorMessage = document.getElementById('ar-error-message');
        const sizeButtons = document.querySelectorAll('.size-button');

        let currentScale = parseFloat(modelViewer.getAttribute('data-current-scale')) || 1.0;
        
        function updateModelScale(scale) {
            if (modelViewer.model && modelViewer.model.scale) {
                modelViewer.model.scale.set(scale, scale, scale);
                currentScale = scale;
            }
        }

        sizeButtons.forEach(button => {
            button.addEventListener('click', () => {
                const newScale = parseFloat(button.getAttribute('data-scale'));
                
                updateModelScale(newScale);

                sizeButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
            });
        });

        modelViewer.addEventListener('ar-session-start', () => {
            setTimeout(() => {
                updateModelScale(currentScale);
            }, 500);
        });

        modelViewer.addEventListener('ar-session-end', () => {
             if (modelViewer.model && modelViewer.model.scale) {
                modelViewer.model.scale.set(1, 1, 1);
            }
        });
        
        modelViewer.addEventListener('ar-status', (event) => {
            const status = event.detail.status;
            const arCustomButton = document.getElementById('ar-custom-button');
            const sizeControls = document.getElementById('size-controls');
            
            if (status === 'failed' || status === 'not-present' || status === 'unsupported') {
                errorMessage.innerHTML = '⚠️ Šis įrenginys nepalaiko Papildytosios Realybės (AR) funkcijos...';
                errorMessage.style.display = 'block';
                arCustomButton.style.display = 'none';
                if (sizeControls) sizeControls.style.display = 'none'; 
            } else {
                errorMessage.style.display = 'none';
                arCustomButton.style.display = 'block';
                if (sizeControls) sizeControls.style.display = 'flex'; 
            }
        });
    </script>
</body>
</html>
