<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR Peržiūra - Paveikslas Vaidilutė</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        .container { position: relative; width: 100%; height: 100vh; }
        body { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100%; z-index: 100; }
        
        /* Dydžio keitimo mygtukų konteineris */
        #size-controls {
            position: absolute; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 2500;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .size-button {
            background-color: #f8f9fa;
            color: #343a40;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s;
        }

        .size-button:hover {
            background-color: #e2e6ea;
            transform: scale(1.05);
        }
        
        /* Aktyvaus mygtuko stilius */
        .size-button.active {
            background-color: #007bff;
            color: white;
            box-shadow: 0 0 5px #007bff;
        }

        #ar-error-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            background: #ffc107; color: #333; padding: 10px 20px; border-radius: 5px; 
            z-index: 9999; font-weight: bold; display: none; text-align: center; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
        }

        /* AR Mygtukas */
        #ar-custom-button {
            background-color: #4CAF50; 
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
            position: absolute; 
            top: 40px; 
            right: 20px; 
            z-index: 2500;
        }
        #ar-custom-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            id="ar-resizable-model"
            
            src="modeliai/dekoras/vaidilutė.glb"
            alt="Paveikslas Vaidilutė" 
            
            ar 
            ar-modes="scene-viewer quick-look webxr" 
            
            camera-controls 
            shadow-intensity="1" 
            exposure="1.0" 
            
            camera-orbit="0 75deg 105%" 
            
            data-current-scale="1.0" 
            
            auto-rotate
            disable-tap
            min-field-of-view="10deg"
            max-field-of-view="45deg"
        >
            <button slot="ar-button" id="ar-custom-button">
                ▶️ Rodyti AR
            </button>
            
            <div id="size-controls">
                <button class="size-button active" data-scale="1.0">
