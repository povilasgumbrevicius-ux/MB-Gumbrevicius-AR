<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR Peržiūra - Sūrainis (Mygtukas Apačioje Centre)</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    
    <style>
        /* Bendrai */
        .container { position: relative; width: 100%; height: 100vh; }
        body { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100%; z-index: 100; transform: translateZ(0); }
        
        /* Hotspot'ų Stiliai */
        .StaticHotspot { position: absolute; z-index: 2000; will-change: transform, opacity; border-radius: 50%; width: 35px; height: 35px; border: 2px solid #FFFFFF; cursor: pointer; box-shadow: 0 0 8px rgba(0, 0, 0, 0.6); transition: transform 0.1s ease; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: white; line-height: 1; }
        .StaticHotspot:hover { transform: scale(1.2); }

        /* HOTSPOT'AI: Viršuje - Laisva vieta garantuota */
        .Alergenai { background: #FF4444; top: 20px; right: 20px; }
        .Sudetis { background: #2AA1FF; top: 80px; right: 20px; }
        .InstrukcijosBtn { background: #6c757d; top: 20px; left: 20px; } 

        /* Tooltip'ai */
        .StaticHotspot .tooltip { visibility: hidden; background-color: #000000; color: #fff; text-align: left; border-radius: 4px; padding: 8px 12px; position: absolute; z-index: 10; width: max-content; max-width: 350px; opacity: 0; transition: opacity 0.3s, visibility 0.3s; pointer-events: none; line-height: 1.4; font-size: 0.95em; }
        .Alergenai .tooltip, .Sudetis .tooltip { right: 120%; top: 50%; transform: translateY(-50%); } 
        .InstrukcijosBtn .tooltip { left: 120%; top: 50%; transform: translateY(-50%); } 
        .StaticHotspot:hover .tooltip { visibility: visible; opacity: 1; }

        #ar-error-message { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: #ffc107; color: #333; padding: 10px 20px; border-radius: 5px; z-index: 9999; font-weight: bold; display: none; text-align: center; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); }
        
        /* AR Mygtuko stiliai */
        #ar-custom-button {
            background-color: #4CAF50; /* Žalia */
            color: white;
            padding: 10px 20px; /* Padidiname, kad būtų centre patrauklesnis */
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: background-color 0.3s;
            z-index: 2500;
        }
        #ar-custom-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <model-viewer 
            src="https://ar.gumbrevicius.lt/modeliai/maistas/cheeseburger.glb" 
            alt="Sūrainis" 
            ios-src="https://ar.gumbrevicius.lt/modeliai/maistas/cheeseburger.glb"
            ar 
            ar-modes="scene-viewer quick-look" 
            
            camera-controls 
            shadow-intensity="1" 
            exposure="1.0" 
            auto-rotate>

            <button slot="ar-button" id="ar-custom-button" style="
                position: absolute; 
                bottom: 10px; 
                left: 50%; 
                transform: translateX(-50%);
                display: block;"> ▶️ Rodyti AR erdvėje
            </button>
            
            <div class="StaticHotspot Alergenai">! <div class="tooltip">...</div></div>
            <div class="StaticHotspot Sudetis">i <div class="tooltip">...</div></div>
            <div class="StaticHotspot InstrukcijosBtn">? <div class="tooltip">...</div></div>

        </model-viewer>
        
    </div>

    <div id="ar-error-message"></div>

    <script>
        const modelViewer = document.querySelector('model-viewer');
        const errorMessage = document.getElementById('ar-error-message');
        const arCustomButton = document.getElementById('ar-custom-button');
        
        // Supaprastinta JS logika: Tik rodomas klaidos pranešimas, jei AR neveikia, 
        // bet mygtuką paliekame HTML, kad būtų rodomas (display: block)
        modelViewer.addEventListener('ar-status', (event) => {
            const status = event.detail.status;
            
            if (status === 'failed' || status === 'not-present' || status === 'unsupported') {
                // Jei AR nepalaikoma, mygtukas paslepiamas, rodomas klaidos pranešimas
                arCustomButton.style.display = 'none';
                errorMessage.innerHTML = '⚠️ Šis įrenginys nepalaiko Papildytosios Realybės (AR) funkcijos. Pabandykite su naujesniu telefonu ar planšete.';
                errorMessage.style.display = 'block';
                
            } else {
                // Jei AR palaikoma, mygtukas rodomas (per HTML stilių), klaidos pranešimas paslepiamas.
                arCustomButton.style.display = 'block';
                errorMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
