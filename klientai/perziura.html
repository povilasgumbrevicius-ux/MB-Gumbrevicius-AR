<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>1001 Legends AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; background: transparent; overflow: hidden; }
        .container { position: relative; width: 100%; height: 100vh; }
        model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
        
        /* Viršutinis pirkimo mygtukas */
        #buy-button {
            position: absolute; top: 20px; left: 20px; z-index: 999;
            background-color: #000; color: #fff; border: none;
            padding: 12px 20px; border-radius: 5px; font-weight: bold;
            cursor: pointer; font-size: 14px; text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* AR Mygtukas apačioje */
        #ar-button {
            background-color: #fff; color: #000; padding: 12px 24px;
            border-radius: 30px; border: 2px solid #000; cursor: pointer;
            font-weight: bold; font-size: 14px; position: absolute;
            bottom: 80px; left: 50%; transform: translateX(-50%);
            z-index: 999; white-space: nowrap;
        }

        /* Navigacija */
        .controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 15px; z-index: 999; 
            background: rgba(255, 255, 255, 0.8); padding: 8px 20px; 
            border-radius: 25px; backdrop-filter: blur(5px);
        }
        .nav-btn { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 15px; cursor: pointer; }
        #model-label { font-size: 14px; font-weight: bold; min-width: 60px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <button id="buy-button" onclick="goToProduct()">🛒 ĮSIGYTI KŪRINĮ</button>

        <model-viewer id="mv" src="" ar ar-modes="webxr scene-viewer quick-look" ar-placement="wall" camera-controls touch-action="pan-y">
            <button slot="ar-button" id="ar-button">VAIZDUOTI ERDVĖJE</button>
        </model-viewer>

        <div class="controls" id="nav-ui">
            <button class="nav-btn" onclick="changeModel(-1)">❮</button>
            <span id="model-label">1 / 12</span>
            <button class="nav-btn" onclick="changeModel(1)">❯</button>
        </div>
    </div>

    <script>
        const folder = "../1001legends/"; 
        
        // Pirkimo nuorodų sąrašas (surašyk visas 12 eiliškumu)
        const purchaseLinks = [
            "https://1001legends.lt/product/barboros-smekla/",      // id=1
            "https://1001legends.lt/product/basiliskas/",           // id=2 (pavyzdys)
            "https://1001legends.lt/product/gelezinis-vilkas/",     // id=3 (pavyzdys)
            "https://1001legends.lt/product/jasinskiai/",           // id=4
            "https://1001legends.lt/product/kazimiero-kariuomene/", // id=5
            "https://1001legends.lt/product/kestucio-laidotuves/",  // id=6
            "https://1001legends.lt/product/lizdeika/",             // id=7
            "https://1001legends.lt/product/onos-baznycia/",        // id=8
            "https://1001legends.lt/product/perkuno-zinycia/",      // id=9
            "https://1001legends.lt/product/tvardausko-knyga/",     // id=10
            "https://1001legends.lt/product/vaidilute/",            // id=11
            "https://1001legends.lt/product/vilniaus-ikurimas/"     // id=12
        ];

        const models = [
            "barboros_smekla.glb", "basiliskas.glb", "gelezinis_vilkas.glb",
            "jasinskiai.glb", "kazimiero_kariuomene.glb", "kestucio_laidotuves.glb",
            "lizdeika.glb", "onos_baznycia.glb", "perkuno_zinycia.glb",
            "tvardausko_knyga.glb", "vaidilute.glb", "vilniaus_ikurimas.glb"
        ];

        const mv = document.getElementById('mv');
        const label = document.getElementById('model-label');
        const urlParams = new URLSearchParams(window.location.search);
        
        let currentIndex = (parseInt(urlParams.get('id')) || 1) - 1;
        if (currentIndex < 0 || currentIndex >= models.length) currentIndex = 0;

        function updateModel() {
            mv.src = folder + models[currentIndex];
            label.innerText = (currentIndex + 1) + " / " + models.length;
            if(urlParams.get('hide') === '1') document.getElementById('nav-ui').style.display = 'none';
        }

        // PAGRINDINĖ FUNKCIJA GRĮŽIMUI Į PARDUOTUVĘ
        window.goToProduct = function() {
            const targetUrl = purchaseLinks[currentIndex];
            if (targetUrl) {
                // window.top nukreipia visą naršyklės langą, ne tik iframe vidų
                window.top.location.href = targetUrl;
            }
        };

        window.changeModel = function(step) {
            currentIndex = (currentIndex + step + models.length) % models.length;
            updateModel();
        };

        updateModel();
    </script>
</body>
</html>
