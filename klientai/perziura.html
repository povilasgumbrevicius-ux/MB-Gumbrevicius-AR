<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>1001 Legends AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; background: transparent; overflow: hidden; }
        .container { position: relative; width: 100%; height: 100vh; }
        model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
        
        /* Mygtukų konteineris - PAŽEMINTAS */
        .top-nav {
            position: absolute; top: 40px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 10px; z-index: 1000;
            padding: 0 10px; box-sizing: border-box;
        }

        /* Suvienodintas mygtukų stilius */
        .action-btn, #ar-button {
            background-color: #ffffff; color: #000; padding: 12px 18px;
            border-radius: 30px; border: 2px solid #000; cursor: pointer;
            font-weight: bold; font-size: 12px; text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            white-space: nowrap; transition: 0.3s;
            display: inline-flex; align-items: center; justify-content: center;
            font-family: sans-serif;
        }
        
        #buy-button { background-color: #000; color: #fff; text-decoration: none; }

        /* Navigacija apačioje (1/12) */
        .controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 15px; z-index: 999; 
            background: rgba(255, 255, 255, 0.8); padding: 8px 20px; 
            border-radius: 25px; backdrop-filter: blur(5px);
        }
        .nav-btn { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 15px; cursor: pointer; }
        #model-label { font-size: 14px; font-weight: bold; min-width: 60px; text-align: center; }

        @media (max-width: 400px) {
            .action-btn, #ar-button { font-size: 10px; padding: 10px 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <model-viewer id="mv" src="" ar ar-modes="webxr scene-viewer quick-look" ar-placement="wall" camera-controls touch-action="pan-y">
            
            <div class="top-nav">
                <a id="buy-button" class="action-btn" href="#" onclick="goToProduct(); return false;">🛒 ĮSIGYTI KŪRINĮ</a>
                
                <button slot="ar-button" id="ar-button">
                    🖼️ VAIZDUOTI ERDVĖJE
                </button>
            </div>

        </model-viewer>

        <div class="controls" id="nav-ui">
            <button class="nav-btn" onclick="changeModel(-1)">❮</button>
            <span id="model-label">1 / 12</span>
            <button class="nav-btn" onclick="changeModel(1)">❯</button>
        </div>
    </div>

    <script>
        const folder = "../1001legends/"; 
        
        const purchaseLinks = [
            "https://1001legends.lt/product/barboros-smekla/",      
            "https://1001legends.lt/product/basiliskas/",           
            "https://1001legends.lt/product/gelezinis-vilkas/",     
            "https://1001legends.lt/product/jasinskiai/",           
            "https://1001legends.lt/product/kazimiero-kariuomene/", 
            "https://1001legends.lt/product/kestucio-laidotuves/",  
            "https://1001legends.lt/product/lizdeika/",             
            "https://1001legends.lt/product/onos-baznycia/",        
            "https://1001legends.lt/product/perkuno-zinycia/",      
            "https://1001legends.lt/product/tvardausko-knyga/",     
            "https://1001legends.lt/product/vaidilute/",            
            "https://1001legends.lt/product/vilniaus-ikurimas/"     
        ];

        const models = [
            "barboros_smekla.glb", "basiliskas.glb", "gelezinis_vilkas.glb",
            "jasinskiai.glb", "kazimiero_kariuomene.glb", "kestucio_laidotuves.glb",
            "lizdeika.glb", "onos_baznycia.glb", "perkuno_zinycia.glb",
            "tvardausko_knyga.glb", "vaidilute.glb", "vilniaus_ikurimas.glb"
        ];

        const mv = document.getElementById('mv');
        const label = document.getElementById('model-label');
        const urlParams = new URLSearchParams(window.location.search);
        
        let currentIndex = (parseInt(urlParams.get('id')) || 1) - 1;
        if (currentIndex < 0 || currentIndex >= models.length) currentIndex = 0;

        function updateModel() {
            // Svarbu: užtikriname, kad src nustatomas tiksliai
            const modelPath = folder + models[currentIndex];
            mv.setAttribute('src', modelPath);
            
            label.innerText = (currentIndex + 1) + " / " + models.length;
            if(urlParams.get('hide') === '1') document.getElementById('nav-ui').style.display = 'none';
        }

        window.goToProduct = function() {
            const targetUrl = purchaseLinks[currentIndex];
            if (targetUrl) {
                window.top.location.href = targetUrl;
            }
        };

        window.changeModel = function(step) {
            currentIndex = (currentIndex + step + models.length) % models.length;
            updateModel();
        };

        // Paleidžiame krovimą
        updateModel();
    </script>
</body>
</html>
