<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR Peržiūra - Dekoras</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js?v=400"></script>
    <style>
        .container { position: relative; width: 100%; height: 100vh; }
        body { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; background: #000; }
        model-viewer { width: 100%; height: 100%; z-index: 100; }
        #ar-error-message { 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            background: #ffc107; color: #333; padding: 10px 20px; border-radius: 5px; 
            z-index: 9999; font-weight: bold; display: none; text-align: center; 
        }
        #ar-custom-button {
            background-color: #4CAF50; 
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            z-index: 2500;
        }
        .action-buttons {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 2500;
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }
        .btn-buy {
            background-color: #ffffff;
            color: #000000;
            padding: 10px 22px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-rent {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 7px 14px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <div class="container">
        <model-viewer 
            id="ar-rotatable-model"
            src="https://ar.gumbrevicius.lt/modeliai/dekoras/dekoras.glb"
            ar 
            ar-modes="scene-viewer quick-look webxr" 
            camera-controls 
            shadow-intensity="1" 
            exposure="1.0" 
            camera-orbit="0 75deg 105%" 
            auto-rotate
            disable-tap
            min-field-of-view="10deg"
            max-field-of-view="45deg"
        >
            <button slot="ar-button" id="ar-custom-button">🔳 PASIMATUOTI</button>
            
            <div class="action-buttons">
                <a href="https://1001legends.lt" class="btn-buy" id="link-buy">PIRKTI</a>
                <a href="https://1001legends.lt/paveikslu-nuoma/" class="btn-rent" id="link-rent">NUOMOTIS</a>
            </div>
        </model-viewer>
    </div>

    <div id="ar-error-message"></div>

    <script>
        const modelViewer = document.querySelector('#ar-rotatable-model');
        const errorMessage = document.getElementById('ar-error-message');
        const arCustomButton = document.getElementById('ar-custom-button'); 

        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'failed' || event.detail.status === 'not-present' || event.detail.status === 'unsupported') {
                errorMessage.innerHTML = '⚠️ Šis įrenginys nepalaiko AR funkcijos.';
                errorMessage.style.display = 'block';
                arCustomButton.style.display = 'none';
            } else {
                errorMessage.style.display = 'none';
                arCustomButton.style.display = 'block';
            }
        });
    </script>
</body>
</html>
