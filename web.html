<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Systems | MB Gumbrevičius</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --wow-blue: #00d2ff;
            /* Tavo patvirtintas Titanium Silver */
            --silver-bg: #b8bdc2;    
            --silver-light: #e1e5e8; 
            --text-main: #1a1c1f;    
            --text-dim: rgba(26, 28, 31, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            background-color: var(--silver-bg);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, var(--silver-light) 0%, var(--silver-bg) 100%);
        }

        /* --- Headeris (Identiškas Portfolio/AR) --- */
        header {
            position: absolute;
            top: 50px;
            left: 50px;
            z-index: 100;
            display: flex;
            align-items: center;
        }

        .back-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            transition: 0.3s;
        }

        .logo-wow {
            height: 70px; 
            width: auto;
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.2));
            margin-right: 25px;
        }

        .company-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            font-size: 1.2rem; 
            letter-spacing: 10px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* --- Main Construction Block --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero-text {
            position: relative;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(3rem, 10vw, 8rem); /* Milžiniškas, bet prisitaikantis tekstas */
            letter-spacing: 25px;
            line-height: 1;
            margin-bottom: 10px;
            color: var(--text-main);
            opacity: 0.9;
            text-transform: uppercase;
        }

        .status-line {
            font-size: 1rem;
            letter-spacing: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-top: 20px;
            font-weight: 200;
        }

        /* Aktyvus inžinerinis elementas */
        .scan-line {
            width: 150px;
            height: 1px;
            background: var(--wow-blue);
            margin: 40px auto;
            box-shadow: 0 0 20px var(--wow-blue);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; width: 50px; }
            50% { opacity: 1; width: 250px; }
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            header { top: 30px; left: 0; width: 100%; justify-content: center; }
            .logo-wow { height: 50px; margin-right: 15px; }
            .company-name { font-size: 0.7rem; letter-spacing: 4px; }
            h1 { letter-spacing: 10px; }
            .status-line { font-size: 0.7rem; letter-spacing: 6px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-link">
            <img src="portfolio/logo/Logo_white_SVG.svg" class="logo-wow" alt="Logo">
            <div class="company-name">MB Gumbrevičius</div>
        </a>
    </header>

    <main>
        <div class="hero-text">
            <h1>UNDER</h1>
            <h1 style="color: var(--wow-blue); text-shadow: 0 0 30px rgba(0, 210, 255, 0.2);">CONSTRUCTION</h1>
            <div class="scan-line"></div>
            <p class="status-line">System Initialization: Web_Module_Active</p>
        </div>
    </main>

</body>
</html>
