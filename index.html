<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumbrevičius | Digital Artisan</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --wow-blue: #00d2ff;
            --silver-dust: rgba(200, 200, 200, 0.15);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: #010101;
            color: #fff;
            font-family: 'Cinzel', serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* --- Pakeistas Headeris iš pirmojo kodo (Horizontalus išdėstymas kairėje) --- */
        header {
            position: absolute; /* Atkabina nuo centravimo */
            top: 50px;
            left: 50px;
            z-index: 30;
            display: flex;
            flex-direction: row; /* Išdėsto horizontaliai */
            align-items: center; /* Išlygiuoja per centrą vertikaliai */
        }

        .logo-wow {
            height: 80px; /* Dydis pritaikytas iš pirmojo kodo */
            width: auto;
            /* Invertuojame spalvą ir pridedame švytėjimą iš antrojo kodo, padidinant ryškumą */
            filter: invert(1) drop-shadow(0 0 10px var(--wow-blue)); 
            opacity: 0.9;
            margin-right: 25px; /* Tarpas iki teksto */
            transition: all 0.5s ease;
        }
        
        .logo-wow:hover {
            filter: invert(1) drop-shadow(0 0 20px var(--wow-blue)) drop-shadow(0 0 5px #fff);
            transform: scale(1.05);
            opacity: 1;
        }

        .company-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            font-size: 1.2rem;
            letter-spacing: 8px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }
        /* --- Pabaiga Pakeisto Headerio --- */

        /* --- Toliau viskas palikta iš antrojo kodo --- */
        /* --- Candlelight (Mažesnis: 125px) --- */
        #candlelight {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle 125px at var(--x, 50%) var(--y, 50%), 
                        rgba(255, 255, 255, 0.03) 0%, 
                        rgba(0, 0, 0, 1) 100%);
            z-index: 10;
            pointer-events: none;
        }

        /* --- Meniu Punktai --- */
        .nav-container {
            z-index: 20;
            text-align: center;
            /* Pridėtas margin-top kompensuoti, kad headeris dabar absolute */
            margin-top: auto; 
            margin-bottom: auto;
        }

        .menu-item {
            display: block;
            font-size: 2rem;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
            letter-spacing: 8px;
            margin: 20px 0;
            filter: blur(6px);
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .menu-item:hover {
            filter: blur(0px);
            color: #fff;
            text-shadow: 0 0 15px var(--wow-blue), 0 0 30px var(--wow-blue);
            letter-spacing: 12px;
        }

        /* --- Footeris su pulsuojančiu el. paštu --- */
        footer {
            z-index: 30;
            padding-bottom: 30px;
            text-align: center;
        }

        .rekvizitai {
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: var(--wow-blue);
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            from { opacity: 0.3; text-shadow: 0 0 5px var(--wow-blue); }
            to { opacity: 1; text-shadow: 0 0 20px var(--wow-blue); }
        }

        /* --- Sidabro dulkės (PETG stilius) --- */
        .dust {
            position: absolute;
            width: 1.5px; height: 1.5px;
            background: var(--silver-dust);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            animation: drift linear infinite;
        }

        @keyframes drift {
            from { transform: translateY(0) translateX(0); opacity: 0; }
            50% { opacity: 0.4; }
            to { transform: translateY(-150px) translateX(20px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="candlelight"></div>

    <header>
        <img src="portfolio/logo/Logo_white_SVG.svg" class="logo-wow" alt="Logo">
        <div class="company-name">MB Gumbrevičius</div>
    </header>

    <div class="nav-container">
        <a href="#portfolio" class="menu-item">Portfolio</a>
        <a href="#ar" class="menu-item">Papildyta realybė</a>
        <a href="#web" class="menu-item">Web dizainas</a>
    </div>

    <footer>
        <div class="rekvizitai">
            povilas@gumbrevicius.lt
        </div>
    </footer>

    <script>
        const candle = document.getElementById('candlelight');
        document.addEventListener('mousemove', (e) => {
            candle.style.setProperty('--x', e.clientX + 'px');
            candle.style.setProperty('--y', e.clientY + 'px');
        });

        // Sidabro dulkių generavimas
        function createDust() {
            const dust = document.createElement('div');
            dust.className = 'dust';
            dust.style.left = Math.random() * 100 + 'vw';
            dust.style.top = Math.random() * 100 + 'vh';
            dust.style.animationDuration = (Math.random() * 8 + 4) + 's';
            document.body.appendChild(dust);
            setTimeout(() => dust.remove(), 12000);
        }
        setInterval(createDust, 400);
    </script>
</body>
</html>
