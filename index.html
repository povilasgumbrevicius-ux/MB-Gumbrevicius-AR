<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumbrevičius MB | CGI & Web Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --wow-blue: #00d2ff;
            --candle-warm: rgba(255, 140, 50, 0.25);
            --silver-dust: rgba(200, 200, 200, 0.12);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: #010101;
            color: #fff;
            font-family: 'Cinzel', serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- Headeris --- */
        header {
            z-index: 40;
            padding: 50px;
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: space-between; /* Pridėta vietos perjungikliui */
            box-sizing: border-box;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .logo-wow {
            height: 80px; 
            width: auto;
            filter: drop-shadow(0 0 30px var(--wow-blue));
            opacity: 0.9;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            margin-right: 25px; 
        }

        .company-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            font-size: 1.4rem; 
            letter-spacing: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            white-space: nowrap; 
        }

        /* --- Kalbos perjungiklis --- */
        .lang-switch {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 3px;
            z-index: 50;
            display: flex;
            gap: 15px;
        }

        .lang-btn {
            color: #fff;
            text-decoration: none;
            opacity: 0.3;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            background: none;
            text-transform: uppercase;
        }

        .lang-btn.active {
            opacity: 1;
            border-bottom: 1px solid var(--wow-blue);
        }

        .lang-btn:hover {
            opacity: 1;
        }

        /* --- Žvakė --- */
        #candlelight {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle 60px at var(--x, 50%) var(--y, 50%), 
                        var(--candle-warm) 0%, 
                        rgba(0, 0, 0, 1) 100%);
            z-index: 10;
            pointer-events: none;
        }

        /* --- Meniu --- */
        .nav-container {
            z-index: 20;
            text-align: center;
            width: 100%;
        }

        .menu-item {
            display: block;
            font-size: 4rem; 
            text-decoration: none;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
            letter-spacing: 25px; 
            margin: 40px 0;
            filter: blur(4px);
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
            z-index: 25;
        }

        .menu-item:hover {
            filter: blur(0px);
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px var(--wow-blue), 0 0 40px var(--wow-blue), 0 0 80px var(--wow-blue);
            transform: scale(1.05);
            letter-spacing: 35px;
        }

        /* --- Footeris --- */
        footer {
            z-index: 30;
            padding-bottom: 60px;
            text-align: center;
            width: 100%;
        }

        .rekvizitai {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            letter-spacing: 5px;
            color: var(--wow-blue);
            text-transform: uppercase;
            animation: pulse-glow 2.5s infinite alternate;
        }

        /* --- MOBILŪS --- */
        @media (max-width: 768px) {
            #candlelight { display: none; }
            header { padding: 30px 20px; flex-direction: column; gap: 20px; }
            .menu-item { filter: blur(0px); color: rgba(255, 255, 255, 0.8); font-size: 1.5rem; letter-spacing: 10px; margin: 30px 0; text-shadow: 0 0 10px var(--wow-blue); animation: pulse-mobile 3s infinite ease-in-out; }
            .logo-wow { height: 50px; margin-right: 0; margin-bottom: 10px; }
            .company-name { font-size: 0.8rem; letter-spacing: 4px; }
        }

        @keyframes pulse-mobile { 0% { opacity: 0.5; } 50% { opacity: 1; text-shadow: 0 0 15px var(--wow-blue); } 100% { opacity: 0.5; } }
        @keyframes pulse-glow { from { opacity: 0.3; } to { opacity: 1; text-shadow: 0 0 20px var(--wow-blue); } }

        .dust { position: absolute; width: 2px; height: 2px; background: var(--silver-dust); border-radius: 50%; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

    <div id="candlelight"></div>

    <header>
        <div class="header-left">
            <img src="portfolio/logo/Logo_white_SVG.svg" class="logo-wow" alt="Logo">
            <div class="company-name">MB Gumbrevičius</div>
        </div>
        
        <div class="lang-switch">
            <button class="lang-btn active" onclick="changeLang('lt')" id="btn-lt">LT</button>
            <button class="lang-btn" onclick="changeLang('en')" id="btn-en">EN</button>
        </div>
    </header>

    <div class="nav-container">
        <a href="portfolio.html" class="menu-item" data-lt="Produktai / CGI" data-en="Products / CGI">Produktai / CGI</a>
        <a href="interiors.html" class="menu-item" data-lt="Interjero Vizualizacija" data-en="Interior Visualization">Interjero Vizualizacija</a>
        <a href="ar.html" class="menu-item" data-lt="Papildyta realybė" data-en="Augmented Reality">Papildyta realybė</a>
    </div>

    <footer>
        <div class="rekvizitai">
            Povilas Gumbrevičius | info@gumbrevicius.lt
        </div>
    </footer>

    <script>
        // --- Kalbos valdymas ---
        function changeLang(lang) {
            // Atnaujiname aktyvų mygtuką
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');

            // Atnaujiname tekstus
            document.querySelectorAll('[data-lt]').forEach(el => {
                el.innerText = el.getAttribute('data-' + lang);
            });

            // Galima pridėti logiką, kad išsaugotų pasirinkimą naršyklėje
            localStorage.setItem('preferredLang', lang);
        }

        // Tikriname, ar vartotojas jau buvo pasirinkęs kalbą anksčiau
        const savedLang = localStorage.getItem('preferredLang');
        if (savedLang && savedLang !== 'lt') {
            changeLang(savedLang);
        }

        // --- Originalūs efektai ---
        const candle = document.getElementById('candlelight');
        const moveHandler = (e) => {
            let x, y;
            if (e.type.includes('touch')) {
                x = e.touches[0].clientX; y = e.touches[0].clientY;
            } else {
                x = e.clientX; y = e.clientY;
            }
            candle.style.setProperty('--x', x + 'px');
            candle.style.setProperty('--y', y + 'px');
        };

        document.addEventListener('mousemove', moveHandler);
        document.addEventListener('touchstart', moveHandler, { passive: false });
        document.addEventListener('touchmove', moveHandler, { passive: false });

        setInterval(() => {
            const dust = document.createElement('div');
            dust.className = 'dust';
            dust.style.left = Math.random() * 100 + 'vw';
            dust.style.top = Math.random() * 100 + 'vh';
            document.body.appendChild(dust);
            setTimeout(() => dust.remove(), 10000);
        }, 400);
    </script>
</body>
</html>
