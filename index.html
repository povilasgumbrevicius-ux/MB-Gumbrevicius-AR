<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumbrevičius MB | CGI & Web Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --wow-blue: #00d2ff;
            --candle-warm: rgba(255, 140, 50, 0.25);
            --silver-dust: rgba(200, 200, 200, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            background-color: #000;
            color: #fff;
            font-family: 'Cinzel', serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* ŽVAKĖ - Sluoksnis apačioje, bet virš fono */
        #candlelight {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle 50px at var(--x, 50%) var(--y, 50%), 
                        var(--candle-warm) 0%, 
                        rgba(0, 0, 0, 1) 100%);
            z-index: 5; /* Žemiau nei tekstas ir logo */
            pointer-events: none;
        }

        /* HEADERIS: Logo + Vardas ŠALIA vienas kito */
        header {
            position: absolute;
            top: 60px;
            left: 60px;
            z-index: 30;
            display: flex;
            flex-direction: row; /* LOGO IR VARDAS VIENOJE EILĖJE */
            align-items: center;
        }

        .logo-wow {
            height: 90px;
            width: auto;
            /* Padidintas drop-shadow 4K ekranui */
            filter: drop-shadow(0 0 15px var(--wow-blue)) drop-shadow(0 0 5px #fff);
            margin-right: 30px;
            transition: all 0.5s ease;
        }

        .company-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            font-size: 1.4rem;
            letter-spacing: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        /* MENIU - Išnaudojame visą erdvę */
        .nav-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .menu-item {
            font-size: 5rem;
            text-decoration: none;
            /* Padidintas pradinis matomumas, kad nebūtų "dingę" */
            color: rgba(255, 255, 255, 0.15); 
            text-transform: uppercase;
            letter-spacing: 25px;
            margin: 35px 0;
            filter: blur(10px);
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .menu-item:hover {
            filter: blur(0px);
            color: #fff;
            /* "Mėlynos ugnies" efektas */
            text-shadow: 0 0 20px var(--wow-blue), 0 0 40px var(--wow-blue), 0 0 60px var(--wow-blue);
            letter-spacing: 35px;
            transform: scale(1.05);
        }

        /* FOOTERIS */
        footer {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            z-index: 30;
        }

        .rekvizitai {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 5px;
            color: var(--wow-blue);
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            from { opacity: 0.4; text-shadow: 0 0 10px var(--wow-blue); }
            to { opacity: 1; text-shadow: 0 0 25px var(--wow-blue); }
        }

        /* Sidabro dulkės */
        .dust {
            position: absolute;
            width: 2px; height: 2px;
            background: var(--silver-dust);
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div id="candlelight"></div>

    <header>
        <img src="portfolio/logo/Logo_white_SVG.svg" class="logo-wow" alt="Logo">
        <div class="company-name">MB Gumbrevičius</div>
    </header>

    <div class="nav-container">
        <a href="#portfolio" class="menu-item">Portfolio</a>
        <a href="#ar" class="menu-item">AR</a>
        <a href="#web" class="menu-item">Web Design</a>
    </div>

    <footer>
        <div class="rekvizitai">
            Povilas Gumbrevičius | info@gumbrevicius.lt
        </div>
    </footer>

    <script>
        const candle = document.getElementById('candlelight');
        document.addEventListener('mousemove', (e) => {
            candle.style.setProperty('--x', e.clientX + 'px');
            candle.style.setProperty('--y', e.clientY + 'px');
        });

        // Dulkių generavimas
        setInterval(() => {
            const dust = document.createElement('div');
            dust.className = 'dust';
            dust.style.left = Math.random() * 100 + 'vw';
            dust.style.top = Math.random() * 100 + 'vh';
            document.body.appendChild(dust);
            setTimeout(() => dust.remove(), 10000);
        }, 400);
    </script>
</body>
</html>
