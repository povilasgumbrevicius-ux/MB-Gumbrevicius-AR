<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumbrevicius |  CGI Artist & Inovator</title>
    <style>
        :root {
            --wow-blue: #00d2ff; /* Šalta, magiška mėlyna */
            --silver-dust: rgba(200, 200, 200, 0.15); /* Sidabro dulkės */
        }

        body, html {
            margin: 0; padding: 0;
            background-color: #020202; /* Ne visiška tamsa, o gilus šešėlis */
            color: #fff;
            font-family: 'Cinzel', serif; /* Mistinis, holivudinis šriftas */
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Sidabro Dulkių ir Miglos Sluoksnis --- */
        #atmosphere {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* Pirminis mistinis švytėjimas centre */
            background: radial-gradient(circle at center, rgba(0, 40, 80, 0.2) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- Candlelight (Žvakės šviesa) su dulkių efektu --- */
        #candlelight {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* Dinaminė šviesa, kurią valdysime per JS */
            background: radial-gradient(circle 250px at var(--x, 50%) var(--y, 50%), 
                        rgba(255, 255, 255, 0.05) 0%, 
                        rgba(0, 0, 0, 0.98) 100%);
            z-index: 10;
            pointer-events: none;
        }

        /* --- Meniu Punktų Stilius (WoW Blue Fire) --- */
        .nav-container {
            z-index: 20;
            text-align: center;
        }

        .menu-item {
            display: block;
            font-size: 2.5rem;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 12px;
            margin: 30px 0;
            filter: blur(4px); /* Pradinis mistinis neryškumas */
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
        }

        .menu-item:hover {
            filter: blur(0px);
            color: #fff;
            letter-spacing: 15px; /* Subtilus išsiplėtimas */
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8),
                0 0 20px var(--wow-blue),
                0 0 40px var(--wow-blue),
                0 0 60px var(--wow-blue);
            animation: ice-fire 1.2s infinite alternate;
        }

        @keyframes ice-fire {
            from { opacity: 0.8; transform: scale(1); }
            to { opacity: 1; transform: scale(1.02); }
        }

        /* --- Papildomas Dust (Dulkių) Sluoksnis --- */
        .dust {
            position: absolute;
            width: 2px; height: 2px;
            background: var(--silver-dust);
            border-radius: 50%;
            pointer-events: none;
            animation: drift linear infinite;
        }

        @keyframes drift {
            from { transform: translateY(0px) rotate(0deg); opacity: 0; }
            50% { opacity: 0.5; }
            to { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="atmosphere"></div>
    <div id="candlelight"></div>

    <div class="nav-container">
        <a href="#about" class="menu-item">Povilas</a>
        <a href="#visuals" class="menu-item">Galerija</a>
        <a href="#tech" class="menu-item">Technologija</a>
    </div>

    <script>
        // Šviesos sekimas
        const candle = document.getElementById('candlelight');
        document.addEventListener('mousemove', (e) => {
            candle.style.setProperty('--x', e.clientX + 'px');
            candle.style.setProperty('--y', e.clientY + 'px');
        });

        // Sukuriame "sidabro dulkių" daleles fone
        function createDust() {
            const dust = document.createElement('div');
            dust.className = 'dust';
            dust.style.left = Math.random() * 100 + 'vw';
            dust.style.top = Math.random() * 100 + 'vh';
            dust.style.animationDuration = (Math.random() * 5 + 5) + 's';
            document.body.appendChild(dust);
            
            setTimeout(() => { dust.remove(); }, 10000);
        }
        setInterval(createDust, 300); // Kas 300ms išmetame po naują "sidabro dulkę"
    </script>
</body>
</html>
