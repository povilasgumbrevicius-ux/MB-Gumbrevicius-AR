<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumbrevičius MB | CGI & Web Design</title>
    <style>
        :root {
            --wow-blue: #00d2ff;
            --silver-dust: rgba(200, 200, 200, 0.15);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: #020202;
            color: #fff;
            font-family: 'Cinzel', serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* --- Headeris --- */
        header {
            z-index: 30;
            padding-top: 40px;
            text-align: center;
        }

        .company-name {
            font-size: 1.5rem;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
        }

        .logo-placeholder {
            margin-top: 15px;
            max-width: 150px; /* Čia bus tavo logo */
        }

        /* --- Candlelight (2x Mažesnis: 125px) --- */
        #candlelight {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle 125px at var(--x, 50%) var(--y, 50%), 
                        rgba(255, 255, 255, 0.04) 0%, 
                        rgba(0, 0, 0, 0.99) 100%);
            z-index: 10;
            pointer-events: none;
        }

        /* --- Meniu --- */
        .nav-container {
            z-index: 20;
            text-align: center;
        }

        .menu-item {
            display: block;
            font-size: 2.2rem;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 10px;
            margin: 25px 0;
            filter: blur(5px);
            transition: all 0.7s ease;
        }

        .menu-item:hover {
            filter: blur(0px);
            color: #fff;
            text-shadow: 0 0 15px var(--wow-blue), 0 0 30px var(--wow-blue);
            transform: scale(1.05);
        }

        /* --- Footeris su pulsuojančiais rekvizitais --- */
        footer {
            z-index: 30;
            padding-bottom: 40px;
            text-align: center;
        }

        .rekvizitai {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--wow-blue);
            text-transform: uppercase;
            animation: pulse-glow 2s infinite alternate;
        }

        @keyframes pulse-glow {
            from {
                opacity: 0.4;
                text-shadow: 0 0 5px var(--wow-blue);
            }
            to {
                opacity: 1;
                text-shadow: 0 0 20px var(--wow-blue), 0 0 40px var(--wow-blue);
            }
        }

        .dust {
            position: absolute;
            width: 1.5px; height: 1.5px;
            background: var(--silver-dust);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="candlelight"></div>

    <header>
        <div class="company-name">"Gumbrevičius" MB</div>
        </header>

    <div class="nav-container">
        <a href="#portfolio" class="menu-item">Portfolio</a>
        <a href="#ar" class="menu-item">Papildyta realybė</a>
        <a href="#web" class="menu-item">Web dizainas</a>
    </div>

    <footer>
        <div class="rekvizitai">
            Povilas Gumbrevičius | MB Gumbrevičius | info@gumbrevicius.lt
        </div>
    </footer>

    <script>
        const candle = document.getElementById('candlelight');
        document.addEventListener('mousemove', (e) => {
            candle.style.setProperty('--x', e.clientX + 'px');
            candle.style.setProperty('--y', e.clientY + 'px');
        });

        // Sidabro dulkių generavimas
        setInterval(() => {
            const dust = document.createElement('div');
            dust.className = 'dust';
            dust.style.left = Math.random() * 100 + 'vw';
            dust.style.top = Math.random() * 100 + 'vh';
            document.body.appendChild(dust);
            setTimeout(() => dust.remove(), 8000);
        }, 400);
    </script>
</body>
</html>
