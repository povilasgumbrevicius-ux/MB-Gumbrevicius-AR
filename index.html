<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumbrevičius MB | CGI & Web Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --wow-blue: #00d2ff;
            --candle-warm: rgba(255, 140, 50, 0.25);
            --silver-dust: rgba(200, 200, 200, 0.12);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: #010101;
            color: #fff;
            font-family: 'Cinzel', serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- Headeris --- */
        header {
            z-index: 30;
            padding: 50px;
            display: flex;
            flex-direction: row; 
            align-items: center;
            box-sizing: border-box;
        }

        .logo-wow {
            height: 80px; 
            width: auto;
            filter: drop-shadow(0 0 30px var(--wow-blue));
            opacity: 0.9;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            margin-right: 25px; 
        }

        .company-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            font-size: 1.4rem; 
            letter-spacing: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            white-space: nowrap; 
        }

        /* --- Žvakė (Padidintas spindulys geresniam matomumui) --- */
        #candlelight {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle 60px at var(--x, 50%) var(--y, 50%), 
                        var(--candle-warm) 0%, 
                        rgba(0, 0, 0, 1) 100%);
            z-index: 10;
            pointer-events: none;
        }

        /* --- Meniu --- */
        .nav-container {
            z-index: 20;
            text-align: center;
            width: 100%;
        }

        .menu-item {
            display: block;
            font-size: 4rem; 
            text-decoration: none;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
            letter-spacing: 25px; 
            margin: 40px 0;
            filter: blur(4px);
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
            z-index: 25;
        }

            filter: blur(0px);
            color: #fff;
            text-shadow: 0 0 10px #fff
