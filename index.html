<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumbrevičius MB | CGI & Web Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --wow-blue: #00d2ff;
            --candle-warm: rgba(255, 140, 50, 0.25);
            --silver-dust: rgba(200, 200, 200, 0.12);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: #010101;
            color: #fff;
            font-family: 'Cinzel', serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- Headeris --- */
        header {
            z-index: 30;
            padding: 50px;
            display: flex;
            flex-direction: row; 
            align-items: center;
            box-sizing: border-box;
        }

        .logo-wow {
            height: 80px; 
            width: auto;
            filter: drop-shadow(0 0 30px var(--wow-blue));
            opacity: 0.9;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            margin-right: 25px; 
        }

        .company-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            font-size: 1.4rem; 
            letter-spacing: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            white-space: nowrap; 
        }

        /* --- Žvakė (Desktopo sluoksnis) --- */
        #candlelight {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle 60px at var(--x, 50%) var(--y, 50%), 
                        var(--candle-warm) 0%, 
                        rgba(0, 0, 0, 1) 100%);
            z-index: 10;
            pointer-events: none;
        }

        /* --- Meniu --- */
        .nav-container {
            z-index: 20;
            text-align: center;
            width: 100%;
        }

        .menu-item {
            display: block;
            font-size: 4rem; 
            text-decoration: none;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
            letter-spacing: 25px; 
            margin: 40px 0;
            filter: blur(4px);
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
            z-index: 25;
        }

        .menu-item:hover {
            filter: blur(0px);
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px var(--wow-blue), 0 0 40px var(--wow-blue), 0 0 80px var(--wow-blue);
            transform: scale(1.1);
            letter-spacing: 35px;
        }

        /* --- Footeris --- */
        footer {
            z-index: 30;
            padding-bottom: 60px;
            text-align: center;
            width: 100%;
        }

        .rekvizitai {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            letter-spacing: 5px;
            color: var(--wow-blue);
            text-transform: uppercase;
            animation: pulse-glow 2.5s infinite alternate;
        }

        /* --- MOBILIŲJŲ ĮRENGINIŲ VALDYMAS --- */
        @media (max-width: 768px) {
            
            #candlelight { display: none; }

            .menu-item { 
                /* BLUR JUNGIKLIS: dabar 0px. Jei nori grąžinti - įrašyk skaičių. */
                filter: blur(0px); 
                color: rgba(255, 255, 255, 0.8); /* Ryškesnės raidės telefone */
                font-size: 1.5rem;
                letter-spacing: 10px;
                margin: 30px 0;
                /* NUOLATINIS ŠVYTĖJIMAS TELEFONE: Kadangi nėra hover, padarome jį pastovų */
                text-shadow: 0 0 10px var(--wow-blue);
                animation: pulse-mobile 3s infinite ease-in-out;
            }

            header {
                padding: 30px 20px;
                justify-content: center;
            }
            .logo-wow {
                height: 50px;
                margin-right: 15px;
            }
            .company-name {
                font-size: 0.8rem;
                letter-spacing: 4px;
            }
            footer {
                padding-bottom: 30px;
            }
            .rekvizitai {
                font-size: 0.7rem;
                letter-spacing: 2px;
            }
        }

        /* Meniu kvėpavimo animacija telefonams */
        @keyframes pulse-mobile {
            0% { opacity: 0.5; text-shadow: 0 0 5px var(--wow-blue); }
            50% { opacity: 1; text-shadow: 0 0 15px var(--wow-blue), 0 0 30px var(--wow-blue); }
            100% { opacity: 0.5; text-shadow: 0 0 5px var(--wow-blue); }
        }

        @keyframes pulse-glow {
            from { opacity: 0.3; text-shadow: 0 0 10px var(--wow-blue); }
            to { opacity: 1; text-shadow: 0 0 30px var(--wow-blue); }
        }

        .dust {
            position: absolute;
            width: 2px; height: 2px;
            background: var(--silver-dust);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="candlelight"></div>

    <header>
        <img src="portfolio/logo/Logo_white_SVG.svg" class="logo-wow" alt="Logo">
        <div class="company-name">MB Gumbrevičius</div>
    </header>

    <div class="nav-container">
        <a href="portfolio.html" class="menu-item">Portfolio</a>
        <a href="ar.html" class="menu-item">Papildyta realybė</a>
        <a href="#web" class="menu-item">Web Design</a>
    </div>

    <footer>
        <div class="rekvizitai">
            Povilas Gumbrevičius | info@gumbrevicius.lt
        </div>
    </footer>

    <script>
        const candle = document.getElementById('candlelight');

        const moveHandler = (e) => {
            let x, y;
            if (e.type.includes('touch')) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            candle.style.setProperty('--x', x + 'px');
            candle.style.setProperty('--y', y + 'px');
        };

        document.addEventListener('mousemove', moveHandler);
        document.addEventListener('touchstart', moveHandler, { passive: false });
        document.addEventListener('touchmove', moveHandler, { passive: false });

        setInterval(() => {
            const dust = document.createElement('div');
            dust.className = 'dust';
            dust.style.left = Math.random() * 100 + 'vw';
            dust.style.top = Math.random() * 100 + 'vh';
            document.body.appendChild(dust);
            setTimeout(() => dust.remove(), 10000);
        }, 400);
    </script>
</body>
</html>
