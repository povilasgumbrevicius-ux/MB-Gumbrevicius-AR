<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumbrevičius MB | CGI & Web Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --wow-blue: #00d2ff;
            --candle-warm: rgba(255, 140, 50, 0.2); /* Dar šiltesnė, jaukesnė liepsna */
            --silver-dust: rgba(200, 200, 200, 0.12);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: #010101;
            color: #fff;
            /* Pagrindinis šriftas - Cinzel, detalėms - Montserrat */
            font-family: 'Cinzel', serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* --- Headeris --- */
        header {
            z-index: 30;
            padding-top: 50px;
            text-align: center;
        }

        .company-name {
            font-family: 'Montserrat', sans-serif; /* Švarus, tech stilius prie MB užrašo */
            font-weight: 200;
            font-size: 1rem;
            letter-spacing: 8px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .logo-wow {
            max-width: 200px; /* Šiek tiek padidinau, kad tavo parašas būtų ryškesnis */
            filter: drop-shadow(0 0 10px var(--wow-blue));
            opacity: 0.9;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .logo-wow:hover {
            filter: drop-shadow(0 0 25px var(--wow-blue));
            transform: scale(1.03);
            opacity: 1;
        }

        /* --- Candlelight (Miniatiūrinė, 35px - tikras mistikos lygis) --- */
        #candlelight {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle 35px at var(--x, 50%) var(--y, 50%), 
                        var(--candle-warm) 0%, 
                        rgba(0, 0, 0, 1) 100%);
            z-index: 10;
            pointer-events: none;
        }

        /* --- Meniu --- */
        .nav-container {
            z-index: 20;
            text-align: center;
        }

        .menu-item {
            display: block;
            font-size: 2.2rem;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.12);
            text-transform: uppercase;
            letter-spacing: 12px;
            margin: 30px 0;
            filter: blur(6px);
            transition: all 0.8s ease;
        }

        .menu-item:hover {
            filter: blur(0px);
            color: #fff;
            text-shadow: 0 0 20px var(--wow-blue), 0 0 40px var(--wow-blue);
            transform: scale(1.05);
            letter-spacing: 16px;
        }

        /* --- Footeris --- */
        footer {
            z-index: 30;
            padding-bottom: 40px;
            text-align: center;
        }

        .rekvizitai {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--wow-blue);
            text-transform: uppercase;
            animation: pulse-glow 2.5s infinite alternate;
        }

        @keyframes pulse-glow {
            from { opacity: 0.3; text-shadow: 0 0 5px var(--wow-blue); }
            to { opacity: 0.9; text-shadow: 0 0 20px var(--wow-blue); }
        }

        .dust {
            position: absolute;
            width: 1.5px; height: 1.5px;
            background: var(--silver-dust);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="candlelight"></div>

    <header>
        <div class="company-name">MB Gumbrevičius</div>
        <img src="portfolio/logo/Logo_white_SVG.svg" class="logo-wow" alt="Logo">
    </header>

    <div class="nav-container">
        <a href="#portfolio" class="menu-item">Portfolio</a>
        <a href="#ar" class="menu-item">Papildyta realybė</a>
        <a href="#web" class="menu-item">Web dizainas</a>
    </div>

    <footer>
        <div class="rekvizitai">
            Povilas Gumbrevičius | info@gumbrevicius.lt
        </div>
    </footer>

    <script>
        const candle = document.getElementById('candlelight');
        document.addEventListener('mousemove', (e) => {
            candle.style.setProperty('--x', e.clientX + 'px');
            candle.style.setProperty('--y', e.clientY + 'px');
        });

        // Sidabro dulkių animacija (lėtesnė, kad jaustųsi PETG svoris)
        setInterval(() => {
            const dust = document.createElement('div');
            dust.className = 'dust';
            dust.style.left = Math.random() * 100 + 'vw';
            dust.style.top = Math.random() * 100 + 'vh';
            document.body.appendChild(dust);
            setTimeout(() => dust.remove(), 10000);
        }, 500);
    </script>
</body>
</html>
