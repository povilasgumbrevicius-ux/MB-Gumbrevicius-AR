<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumbrevičius MB | CGI & Web Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --wow-blue: #00d2ff;
            --candle-warm: rgba(255, 140, 50, 0.25);
            --silver-dust: rgba(200, 200, 200, 0.12);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: #010101;
            color: #fff;
            font-family: 'Cinzel', serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- Headeris: LOGO + PAVADINIMAS ŠALIA --- */
        header {
            z-index: 30;
            padding: 50px;
            display: flex;
            flex-direction: row; /* Horizontalus išdėstymas */
            align-items: center; /* Centruojame vertikaliai vienas kito atžvilgiu */
            box-sizing: border-box;
        }

        .logo-wow {
            height: 80px; /* Padidintas logo aukštis desktopui */
            width: auto;
            filter: drop-shadow(0 0 10px var(--wow-blue));
            opacity: 0.9;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            margin-right: 25px; /* Tarpas tarp logo ir pavadinimo */
        }

        .company-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            font-size: 1.4rem; /* Didesnis pavadinimas */
            letter-spacing: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            white-space: nowrap; /* Kad nesulaužytų į dvi eilutes */
        }

        .logo-wow:hover {
            filter: drop-shadow(0 0 25px var(--wow-blue));
            transform: scale(1.05);
        }

        /* --- Candlelight (35px core, bet su minkštu perėjimu) --- */
        #candlelight {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle 35px at var(--x, 50%) var(--y, 50%), 
                        var(--candle-warm) 0%, 
                        rgba(0, 0, 0, 1) 100%);
            z-index: 10;
            pointer-events: none;
        }

        /* --- Meniu: PADIDINTAS DESKTOPUI --- */
        .nav-container {
            z-index: 20;
            text-align: center;
            width: 100%;
        }

        .menu-item {
            display: block;
            font-size: 4rem; /* Drastiškai padidintas šriftas (buvo 2.2) */
            text-decoration: none;
            color: rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
            letter-spacing: 25px; /* Didesni tarpai tarp raidžių */
            margin: 40px 0;
            filter: blur(8px);
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .menu-item:hover {
            filter: blur(0px);
            color: #fff;
            text-shadow: 0 0 30px var(--wow-blue), 0 0 60px var(--wow-blue);
            transform: scale(1.1);
            letter-spacing: 35px;
        }

        /* --- Footeris --- */
        footer {
            z-index: 30;
            padding-bottom: 60px;
            text-align: center;
            width: 100%;
        }

        .rekvizitai {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            letter-spacing: 5px;
            color: var(--wow-blue);
            text-transform: uppercase;
            animation: pulse-glow 2.5s infinite alternate;
        }

        @keyframes pulse-glow {
            from { opacity: 0.3; text-shadow: 0 0 10px var(--wow-blue); }
            to { opacity: 1; text-shadow: 0 0 30px var(--wow-blue); }
        }

        .dust {
            position: absolute;
            width: 2px; height: 2px;
            background: var(--silver-dust);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="candlelight"></div>

    <header>
        <img src="portfolio/logo/Logo_white_SVG.svg" class="logo-wow" alt="Logo">
        <div class="company-name">MB Gumbrevičius</div>
    </header>

    <div class="nav-container">
        <a href="#portfolio" class="menu-item">Portfolio</a>
        <a href="#ar" class="menu-item">AR</a>
        <a href="#web" class="menu-item">Web Design</a>
    </div>

    <footer>
        <div class="rekvizitai">
            Povilas Gumbrevičius | info@gumbrevicius.lt
        </div>
    </footer>

    <script>
        const candle = document.getElementById('candlelight');
        document.addEventListener('mousemove', (e) => {
            candle.style.setProperty('--x', e.clientX + 'px');
            candle.style.setProperty('--y', e.clientY + 'px');
        });

        // Sidabro dulkių animacija
        setInterval(() => {
            const dust = document.createElement('div');
            dust.className = 'dust';
            dust.style.left = Math.random() * 100 + 'vw';
            dust.style.top = Math.random() * 100 + 'vh';
            document.body.appendChild(dust);
            setTimeout(() => dust.remove(), 10000);
        }, 400);
    </script>
</body>
</html>
